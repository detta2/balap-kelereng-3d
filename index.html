<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= KONFIG ================= */
const PALETTE = ['#e53935','#fb8c00','#c0ca33','#43a047','#00acc1','#1e88e5','#8e24aa','#ec407a',
                 '#fdd835','#78909c','#d81b60','#6d4c41','#00e5ff','#ff5722','#9ccc65','#ba68c8'];
const G = 14.0;               // gravitasi (kalibrasi: terasa berbobot & cepat)
const ROLL_F = 0.28;          // rolling friction
const DRAG = 0.0035;          // air drag
const RAIL_REST = 0.55;       // restitusi pagar
const TRACK_W = 8, HALF_W = 4;
const MARBLE_R = 0.55;
const FINISH_COUNT = 3;       // balapan selesai saat 3 finis
const RACE_TIMEOUT = 240;

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
function fmtTime(s){ const m=Math.floor(s/60), ss=(s%60);
  return String(m).padStart(2,'0')+':'+ss.toFixed(1).padStart(4,'0'); }

/* ================= AUDIO (Web Audio API) ================= */
let AC=null, master=null, mediaDest=null, soundOn=true, rollGain=null;
function initAudio(){
  if (AC) { if (AC.state==='suspended') AC.resume(); return; }
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.5;
  master.connect(AC.destination);
  mediaDest = AC.createMediaStreamDestination();
  master.connect(mediaDest);
  // rolling noise loop (gain diatur per-frame dari kecepatan)
  const buf = AC.createBuffer(1, AC.sampleRate*1, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=320;
  rollGain = AC.createGain(); rollGain.gain.value=0;
  src.connect(f); f.connect(rollGain); rollGain.connect(master); src.start();
}
function beep(fr, dur=0.12, type='square', vol=0.25, when=0){
  if (!AC || !soundOn) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type=type; o.frequency.value=fr;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
}
function thock(intensity=1){
  if (!AC || !soundOn) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(300+Math.random()*200,t);
  o.frequency.exponentialRampToValueAtTime(90,t+0.09);
  const v = clamp(0.12*intensity,0.02,0.4);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.15);
}
function boosterSfx(){ beep(220,0.35,'sawtooth',0.2); beep(440,0.3,'sawtooth',0.15,0.08); beep(880,0.35,'sawtooth',0.12,0.16); }
function fanfare(){
  if (!AC) return;
  [523,659,784,1047,784,1047].forEach((f,i)=>beep(f,0.22,'triangle',0.3,i*0.14));
}
function countBeep(final){ beep(final?880:440, final?0.4:0.15, 'square', 0.3); }

/* ================= TRACK BUILDER ================= */
let seed = (Math.random()*1e9)|0;
function srand(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }

const track = { pts:[], s:[], total:0, pos:[], tan:[], side:[], up:[], curve:null, step:0.5 };
const zones = {};   // s-ranges untuk rintangan
let FINISH_S = 0;

function buildTrack() {
  track.pts.length = 0;
  let x=0, y=92, z=0, ang=0;
  const push=()=>track.pts.push(new THREE.Vector3(x,y,z));
  push();
  function seg(len, dAngDeg, dy, jitter=0){
    const dAng=dAngDeg*Math.PI/180, n=Math.max(2,Math.round(len/8));
    for(let i=0;i<n;i++){
      ang += dAng/n + (jitter?(srand()-0.5)*jitter/n:0);
      const ds=len/n;
      x+=Math.sin(ang)*ds; z+=Math.cos(ang)*ds; y+=dy/n;
      push();
    }
  }
  const jz=()=> (srand()-0.5)*24;   // variasi arah tiap lintasan acak
  seg(50, 0, -3);                    // start straight
  seg(70, 55+jz()*0.4, -8);          // tikungan kanan
  seg(95, -12, -6);                  // zona pegboard (zig-zag)
  seg(60, -52+jz()*0.4, -7);         // tikungan kiri
  seg(95, 10, -6);                   // zona spinner
  seg(115, 0, 0);                    // zona gelombang
  seg(55, -18, -26);                 // turunan curam
  seg(85, 12, -4);                   // zona booster
  seg(95, -14, -6);                  // zona bumper
  seg(50, 32, -4); seg(50, -32, -4);  // slalom
  seg(65, 0, -2);                    // finish straight

  // gelombang vertikal di zona waves (s 375..490)
  const c0=new THREE.CatmullRomCurve3(track.pts);
  const L0=c0.getLength();
  // hitung s kasar dulu untuk menemukan zona waves
  const tmpS=[]; let acc=0;
  for(let i=1;i<track.pts.length;i++){ acc+=track.pts[i].distanceTo(track.pts[i-1]); tmpS.push(acc); }
  for(let i=1;i<track.pts.length;i++){
    const s=tmpS[i-1];
    if (s>375 && s<490) track.pts[i].y += 2.0*Math.sin((s-375)/115*Math.PI*4);
  }
  track.curve=new THREE.CatmullRomCurve3(track.pts);
  track.total=track.curve.getLength();
  // lookup table tiap 0.5m
  const N=Math.ceil(track.total/track.step)+1;
  track.pos=new Array(N); track.tan=new Array(N); track.side=new Array(N); track.up=new Array(N);
  const up=new THREE.Vector3(0,1,0), T=new THREE.Vector3(), S=new THREE.Vector3(), U=new THREE.Vector3();
  for(let i=0;i<N;i++){
    const u=clamp(i*track.step/track.total,0,1);
    const p=track.curve.getPointAt(u);
    track.curve.getTangentAt(u,T);
    S.crossVectors(up,T).normalize();
    if (S.lengthSq()<0.5) S.set(1,0,0);
    U.crossVectors(T,S).normalize();
    track.pos[i]=p.clone(); track.tan[i]=T.clone(); track.side[i]=S.clone(); track.up[i]=U.clone();
  }
  FINISH_S=track.total-22;
  zones.pegs=[128,215]; zones.spinners=[278,368]; zones.boost=[528,608]; zones.bump=[618,708];
}
function frameAt(s, out){
  const i=clamp(Math.round(s/track.step),0,track.pos.length-1);
  out.pos.copy(track.pos[i]); out.tan.copy(track.tan[i]);
  out.side.copy(track.side[i]); out.up.copy(track.up[i]);
  return out;
}

/* ================= SCENE ================= */
const canvas=$('c3d');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070f);
scene.fog=new THREE.Fog(0x05070f, 60, 260);

const camera=new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 1200);
camera.position.set(0,100,40);

const controls=new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.maxDistance=220; controls.minDistance=4;
controls.enabled=false;   // aktif hanya di mode Free Orbit

// --- lighting: ambient + directional shadow + hemisphere ---
scene.add(new THREE.AmbientLight(0x8fa8d0, 0.55));
const hemi=new THREE.HemisphereLight(0xbdd4ff, 0x1a1430, 0.5); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=10; sun.shadow.camera.far=160;
sun.shadow.camera.left=-45; sun.shadow.camera.right=45;
sun.shadow.camera.top=45; sun.shadow.camera.bottom=-45;
sun.shadow.bias=-0.0004;
scene.add(sun); scene.add(sun.target);

// --- ground jauh + grid dekoratif ---
{
  const g=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),
    new THREE.MeshStandardMaterial({color:0x0a0e1a, roughness:1}));
  g.rotation.x=-Math.PI/2; g.position.y=-14; g.receiveShadow=true; scene.add(g);
  const grid=new THREE.GridHelper(1200, 60, 0x1c2f55, 0x111c33);
  grid.position.y=-13.5; scene.add(grid);
}

let trackGroup=null;
function checkerTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d'), n=8, s=128/n;
  for(let r=0;r<n;r++)for(let q=0;q<n;q++){ x.fillStyle=(r+q)%2?'#111':'#f5f5f5'; x.fillRect(q*s,r*s,s,s); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
function buildTrackMesh(){
  if (trackGroup) { scene.remove(trackGroup); trackGroup.traverse(o=>{o.geometry&&o.geometry.dispose();}); }
  trackGroup=new THREE.Group(); scene.add(trackGroup);
  const N=track.pos.length, W2=HALF_W;
  const vtx=new Float32Array(N*2*3), nrm=new Float32Array(N*2*3), uv=new Float32Array(N*2*2);
  const F={pos:new THREE.Vector3(),tan:new THREE.Vector3(),side:new THREE.Vector3(),up:new THREE.Vector3()};
  const curv=new Float32Array(N);
  for(let i=0;i<N;i++){
    frameAt(i*track.step,F);
    const lx=F.pos.x-F.side.x*W2, ly=F.pos.y-F.side.y*W2, lz=F.pos.z-F.side.z*W2;
    const rx=F.pos.x+F.side.x*W2, ry=F.pos.y+F.side.y*W2, rz=F.pos.z+F.side.z*W2;
    vtx.set([lx,ly,lz, rx,ry,rz], i*6);
    nrm.set([F.up.x,F.up.y,F.up.z, F.up.x,F.up.y,F.up.z], i*6);
    uv.set([0,i*track.step/8, 1,i*track.step/8], i*4);
    if(i>0&&i<N-1){
      const a=track.tan[i-1], b=track.tan[i+1];
      curv[i]=Math.acos(clamp(a.dot(b),-1,1))/ (2*track.step);
    }
  }
  const idx=[];
  for(let i=0;i<N-1;i++){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(vtx,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setIndex(idx);
  const roadMat=new THREE.MeshStandardMaterial({color:0x39445e, roughness:0.85, metalness:0.08});
  const road=new THREE.Mesh(g,roadMat); road.receiveShadow=true; trackGroup.add(road);

  // garis tengah putus-putus (strip tipis emissive)
  {
    const pts=[];
    for(let i=0;i<N;i+=4){ const F2={pos:new THREE.Vector3(),tan:new THREE.Vector3(),side:new THREE.Vector3(),up:new THREE.Vector3()};
      frameAt(i*track.step,F2); pts.push(new THREE.Vector3(F2.pos.x+F2.up.x*0.06, F2.pos.y+F2.up.y*0.06, F2.pos.z+F2.up.z*0.06)); }
    const lg=new THREE.BufferGeometry().setFromPoints(pts);
    trackGroup.add(new THREE.Line(lg,new THREE.LineDashedMaterial({color:0x9fb8d8,dashSize:2,gapSize:3,transparent:true,opacity:0.5})));
    trackGroup.children[trackGroup.children.length-1].computeLineDistances();
  }

  // --- pagar pembatas: dinding rendah + neon rail guard di atasnya ---
  // tinggi pagar naik di tikungan tajam (anti-out-of-bounds)
  const railMat=new THREE.MeshStandardMaterial({color:0x223148, roughness:0.6, metalness:0.3, transparent:true, opacity:0.92});
  const neonMat=new THREE.MeshBasicMaterial({color:0x00e5ff});
  [-1,1].forEach(sideSign=>{
    const wv=[], wuv=[];
    const widx=[];
    for(let i=0;i<N;i++){
      frameAt(i*track.step,F);
      const hgt=0.9+clamp(curv[i]*22,0,1.1);   // tikungan tajam -> pagar lebih tinggi
      const bx=F.pos.x+F.side.x*W2*sideSign, by=F.pos.y+F.side.y*W2*sideSign, bz=F.pos.z+F.side.z*W2*sideSign;
      const ux=F.up.x, uy=F.up.y, uz=F.up.z;
      wv.push(bx,by,bz, bx+ux*hgt,by+uy*hgt,bz+uz*hgt);
      wuv.push(0,i*track.step/8, 1,i*track.step/8);
      if(i<N-1){ const a=i*2; widx.push(a,a+2,a+1, a+1,a+2,a+3); }
    }
    const wg=new THREE.BufferGeometry();
    wg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(wv),3));
    wg.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(wuv),2));
    wg.setIndex(widx); wg.computeVertexNormals();
    const wall=new THREE.Mesh(wg,new THREE.MeshStandardMaterial({color:0x2a3a58,roughness:0.55,metalness:0.25,side:THREE.DoubleSide,transparent:true,opacity:0.85}));
    wall.castShadow=true; trackGroup.add(wall);
    // neon tube di puncak pagar
    const topPts=[];
    for(let i=0;i<N;i+=2){
      frameAt(i*track.step,F);
      const hgt=0.9+clamp(curv[i]*22,0,1.1);
      topPts.push(new THREE.Vector3(F.pos.x+F.side.x*W2*sideSign+F.up.x*(hgt+0.08),
        F.pos.y+F.side.y*W2*sideSign+F.up.y*(hgt+0.08), F.pos.z+F.side.z*W2*sideSign+F.up.z*(hgt+0.08)));
    }
    const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(topPts),Math.ceil(N/2),0.14,8),neonMat);
    trackGroup.add(tube);
  });

  // --- garis start & finish checkerboard ---
  const chk=checkerTex();
  function gateAt(s, label, color){
    frameAt(s,F);
    const w=HALF_W*2, d=3;
    const gg=new THREE.PlaneGeometry(w,d);
    const m=new THREE.Mesh(gg,new THREE.MeshBasicMaterial({map:chk.clone()}));
    m.material.map.repeat.set(6,1); m.material.map.needsUpdate=true;
    m.position.copy(F.pos).addScaledVector(F.up,0.07);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),F.up);
    // orientasikan searah lintasan
    const look=new THREE.Matrix4().lookAt(new THREE.Vector3(),F.tan.clone().negate(),F.up);
    m.quaternion.setFromRotationMatrix(look);
    m.rotateX(-Math.PI/2);
    trackGroup.add(m);
    // tiang + banner
    const poleG=new THREE.CylinderGeometry(0.22,0.22,7,10);
    const poleM=new THREE.MeshStandardMaterial({color:0x8a97ad,roughness:0.4,metalness:0.7});
    [-1,1].forEach(sg=>{
      const p=new THREE.Mesh(poleG,poleM);
      p.position.copy(F.pos).addScaledVector(F.side,sg*(HALF_W+0.6)).addScaledVector(F.up,3.5);
      p.castShadow=true; trackGroup.add(p);
    });
    const bw=HALF_W*2+2.4;
    const bg=new THREE.Mesh(new THREE.PlaneGeometry(bw,1.7),
      new THREE.MeshBasicMaterial({color, side:THREE.DoubleSide}));
    bg.position.copy(F.pos).addScaledVector(F.up,6.4);
    const look2=new THREE.Matrix4().lookAt(new THREE.Vector3(),F.tan.clone().negate(),F.up);
    bg.quaternion.setFromRotationMatrix(look2);
    trackGroup.add(bg);
    const cv=document.createElement('canvas'); cv.width=512; cv.height=96;
    const cx2=cv.getContext('2d'); cx2.fillStyle=color==0x111111?'#ffffff':'#111111';
    cx2.font='900 64px Trebuchet MS'; cx2.textAlign='center'; cx2.textBaseline='middle';
    cx2.fillText(label,256,50);
    const tx=new THREE.CanvasTexture(cv);
    const tm=new THREE.Mesh(new THREE.PlaneGeometry(bw*0.92,1.45),
      new THREE.MeshBasicMaterial({map:tx,transparent:true,side:THREE.DoubleSide}));
    tm.position.copy(bg.position).addScaledVector(F.tan,0.06);
    tm.quaternion.copy(bg.quaternion); trackGroup.add(tm);
  }
  gateAt(8,'START',0x2e7d32);
  gateAt(FINISH_S,'FINISH',0x111111);
}

const pegs=[], spinners=[], boosters=[], bumpers=[];
let obsGroup=null;
function clearObstacles(){ pegs.length=0; spinners.length=0; boosters.length=0; bumpers.length=0;
  if(obsGroup){ scene.remove(obsGroup); obsGroup.traverse(o=>{o.geometry&&o.geometry.dispose();}); } obsGroup=new THREE.Group(); scene.add(obsGroup); }
const F2={pos:new THREE.Vector3(),tan:new THREE.Vector3(),side:new THREE.Vector3(),up:new THREE.Vector3()};
function placeOnTrack(obj,s,lat,h=0){ frameAt(s,F2);
  obj.position.copy(F2.pos).addScaledVector(F2.side,lat).addScaledVector(F2.up,h); return F2; }

function buildObstacles(){
  clearObstacles();
  const pegMat=new THREE.MeshStandardMaterial({color:0xffb300,roughness:0.35,metalness:0.55});
  const pegGeo=new THREE.CylinderGeometry(0.34,0.42,1.7,14);
  // 1) PAKU SILINDER zig-zag
  for(let s=zones.pegs[0]; s<zones.pegs[1]; s+=9){
    const row=Math.round((s-zones.pegs[0])/9);
    const lat=(row%2? -2.1:2.1) + (srand()-0.5)*0.6;
    const m=new THREE.Mesh(pegGeo,pegMat);
    placeOnTrack(m,s,lat,0.85); m.castShadow=true; obsGroup.add(m);
    pegs.push({s,lat,r:0.42});
  }
  // 2) KINCIR/PALU BERPUTAR 3D
  const armMat=new THREE.MeshStandardMaterial({color:0xe53935,roughness:0.4,metalness:0.35});
  const hubMat=new THREE.MeshStandardMaterial({color:0x37474f,roughness:0.5,metalness:0.6});
  [0.32,0.55,0.78].forEach((f,i)=>{
    const s=lerp(zones.spinners[0],zones.spinners[1],f);
    const grp=new THREE.Group();
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,1.2,12),hubMat);
    grp.add(hub);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(6.4,0.55,0.9),armMat);
    arm.castShadow=true; grp.add(arm);
    const tipG=new THREE.SphereGeometry(0.62,12,10);
    [-3.2,3.2].forEach(x=>{ const t=new THREE.Mesh(tipG,armMat); t.position.x=x; grp.add(t); });
    const fr=placeOnTrack(grp,s,0,1.15);
    // orientasi grup mengikuti frame lintasan
    const m4=new THREE.Matrix4().makeBasis(fr.side.clone(),fr.up.clone(),fr.tan.clone().negate());
    grp.quaternion.setFromRotationMatrix(m4);
    obsGroup.add(grp);
    spinners.push({s,lat:0,half:3.2,ang:srand()*6.28,spd:(1.6+srand()*0.9)*(i%2?-1:1),grp,fr:{side:fr.side.clone(),up:fr.up.clone()}});
  });
  // 3) SPEED BOOSTER PAD (menyala hijau/cyan)
  const padGeo=new THREE.PlaneGeometry(5.6,9);
  for(let i=0;i<3;i++){
    const s=zones.boost[0]+14+i*24;
    const cv=document.createElement('canvas'); cv.width=128; cv.height=128;
    const c2=cv.getContext('2d');
    const grd=c2.createLinearGradient(0,0,0,128);
    grd.addColorStop(0,'#00ffcc'); grd.addColorStop(1,'#0099ff');
    c2.fillStyle=grd; c2.fillRect(0,0,128,128);
    c2.fillStyle='rgba(255,255,255,.85)';
    for(let k=0;k<3;k++){ const y=20+k*36; c2.beginPath(); c2.moveTo(34,y); c2.lineTo(94,y+18); c2.lineTo(34,y+36); c2.closePath(); c2.fill(); }
    const tx=new THREE.CanvasTexture(cv);
    const m=new THREE.Mesh(padGeo,new THREE.MeshBasicMaterial({map:tx,transparent:true,opacity:0.95}));
    const fr=placeOnTrack(m,s,0,0.09);
    const look=new THREE.Matrix4().lookAt(new THREE.Vector3(),fr.tan.clone().negate(),fr.up);
    m.quaternion.setFromRotationMatrix(look); m.rotateX(-Math.PI/2);
    obsGroup.add(m);
    // glow plane di bawah
    const glow=new THREE.Mesh(padGeo,new THREE.MeshBasicMaterial({color:0x00ffcc,transparent:true,opacity:0.22}));
    glow.position.copy(m.position).addScaledVector(fr.up,0.02); glow.quaternion.copy(m.quaternion);
    obsGroup.add(glow);
    boosters.push({s0:s-4.5,s1:s+4.5,lat:2.8,mesh:m,glow});
  }
  // 4) BUMPER PINBALL silinder
  const bGeo=new THREE.CylinderGeometry(0.85,1.0,1.5,18);
  const bMatA=new THREE.MeshStandardMaterial({color:0xff1744,roughness:0.3,metalness:0.4,emissive:0x550000});
  const bMatB=new THREE.MeshStandardMaterial({color:0x2979ff,roughness:0.3,metalness:0.4,emissive:0x000533});
  for(let i=0;i<6;i++){
    const s=zones.bump[0]+12+i*14;
    const lat=(i%2? -1.9:1.9);
    const m=new THREE.Mesh(bGeo,i%2?bMatA:bMatB);
    placeOnTrack(m,s,lat,0.75); m.castShadow=true; obsGroup.add(m);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.95,0.1,8,24),
      new THREE.MeshBasicMaterial({color:0xffffff}));
    ring.position.copy(m.position); ring.rotation.x=Math.PI/2; obsGroup.add(ring);
    bumpers.push({s,lat,r:1.0,ring});
  }
}

/* ================= KELERENG (MeshPhysicalMaterial kaca) ================= */
const marbles=[];
let marbleGroup=null;
function marbleTexture(hex){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d');
  x.fillStyle=hex; x.fillRect(0,0,256,256);
  // corak pusaran kontras ala kelereng kaca asli
  x.strokeStyle='rgba(255,255,255,.85)'; x.lineCap='round';
  for(let k=0;k<5;k++){
    x.lineWidth=10+Math.random()*14; x.beginPath();
    const y0=30+k*44;
    for(let px=0;px<=256;px+=8) x.lineTo(px, y0+Math.sin(px*0.05+k)*22);
    x.stroke();
  }
  x.fillStyle='rgba(255,255,255,.25)';
  for(let k=0;k<30;k++){ x.beginPath(); x.arc(Math.random()*256,Math.random()*256,2+Math.random()*5,0,7); x.fill(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function clearMarbles(){ marbles.length=0;
  if(marbleGroup){ scene.remove(marbleGroup); marbleGroup.traverse(o=>{o.geometry&&o.geometry.dispose();}); }
  marbleGroup=new THREE.Group(); scene.add(marbleGroup); }
function buildMarbles(names){
  clearMarbles();
  const geo=new THREE.SphereGeometry(MARBLE_R,40,28);
  names.forEach((nm,i)=>{
    const hex=PALETTE[i%PALETTE.length];
    const mat=new THREE.MeshPhysicalMaterial({
      map:marbleTexture(hex), roughness:0.08, metalness:0.0,
      clearcoat:1.0, clearcoatRoughness:0.1,
      ior:1.5, reflectivity:0.9,
      emissive:new THREE.Color(hex), emissiveIntensity:0.06,
    });
    const mesh=new THREE.Mesh(geo,mat);
    mesh.castShadow=true; marbleGroup.add(mesh);
    // motion trail (line)
    const TN=36;
    const tg=new THREE.BufferGeometry();
    tg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(TN*3),3));
    tg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(TN*3),3));
    const tl=new THREE.Line(tg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending}));
    tl.frustumCulled=false; marbleGroup.add(tl);
    const mb={ i, name:nm, color:hex, mesh, trail:tl, trailN:TN, trailPts:[],
      s:2, lat:-3+6*(i/Math.max(1,names.length-1))+(Math.random()-0.5), h:0,
      vs:0, vlat:0, vh:0, finished:false, finishTime:0,
      stuckT:0, lastS:2, spin:new THREE.Vector3(),
      tag:makeTag(nm,hex), boostCd:0 };
    // acak urutan lateral biar adil
    mb.lat=(Math.random()*2-1)*3;
    marbles.push(mb);
  });
}
function makeTag(name,hex){
  const el=document.createElement('div'); el.className='tag';
  el.innerHTML='<span class="dot" style="background:'+hex+'"></span><span class="tx"></span>';
  $('tags').appendChild(el); return el;
}

/* ================= PARTIKEL ================= */
const PMAX=420;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(PMAX*3), pCol=new Float32Array(PMAX*3);
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const points=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.5,vertexColors:true,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
points.frustumCulled=false; scene.add(points);
const parts=[]; for(let i=0;i<PMAX;i++) parts.push({life:0,x:0,y:0,z:0,vx:0,vy:0,vz:0,r:1,g:1,b:1});
let pIdx=0;
function spark(p,n,color,spd=6,up=4){
  const c=new THREE.Color(color);
  for(let k=0;k<n;k++){
    const q=parts[pIdx]; pIdx=(pIdx+1)%PMAX;
    q.life=0.5+Math.random()*0.5; q.x=p.x; q.y=p.y; q.z=p.z;
    const a=Math.random()*6.28, e=Math.random()*spd;
    q.vx=Math.cos(a)*e; q.vz=Math.sin(a)*e; q.vy=Math.random()*up;
    q.r=c.r; q.g=c.g; q.b=c.b;
  }
}
function confetti(p){
  const cols=[0xffd54f,0xef5350,0x29b6f6,0x66bb6a,0xffffff];
  for(let k=0;k<60;k++) spark(p,1,cols[k%cols.length],9,10);
}
function stepParticles(dt){
  for(let i=0;i<PMAX;i++){ const q=parts[i];
    if(q.life>0){ q.life-=dt; q.vy-=12*dt;
      q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt;
      if(q.y<0){q.y=0;q.vy*=-0.4;} }
    const f=clamp(q.life*2,0,1);
    pPos[i*3]=q.x; pPos[i*3+1]=q.y; pPos[i*3+2]=q.z;
    pCol[i*3]=q.r*f; pCol[i*3+1]=q.g*f; pCol[i*3+2]=q.b*f;
  }
  pGeo.attributes.position.needsUpdate=true; pGeo.attributes.color.needsUpdate=true;
}

/* ================= FISIKA (track-space, stabil & cepat) ================= */
const FR={pos:new THREE.Vector3(),tan:new THREE.Vector3(),side:new THREE.Vector3(),up:new THREE.Vector3()};
const _v=new THREE.Vector3();
function marbleWorld(m,out){ frameAt(m.s,FR);
  out.copy(FR.pos).addScaledVector(FR.side,m.lat).addScaledVector(FR.up,MARBLE_R+m.h); return out; }

function physStep(dt, t){
  const n=marbles.length;
  // 1) gerak maju + lateral + vertikal per kelereng
  for(const m of marbles){
    if(state!=='race') break;
    if(m.finished){ m.vs=Math.max(0,m.vs-8*dt); }
    frameAt(m.s,FR);
    const slope=FR.tan.y;                    // <0 turunan, >0 tanjakan
    let a=-G*slope - ROLL_F*Math.sign(m.vs) - DRAG*m.vs*Math.abs(m.vs);
    if(m.finished) a-=4;
    m.vs=Math.max(0,m.vs+a*dt);
    m.s+=m.vs*dt;
    // lateral: redaman + pagar dengan restitusi
    m.vlat*=Math.max(0,1-2.2*dt);
    m.lat+=m.vlat*dt;
    const lim=HALF_W-MARBLE_R-0.15;
    if(m.lat>lim){ m.lat=lim; if(m.vlat>0){ m.vlat=-m.vlat*RAIL_REST; thock(m.vlat); spark(marbleWorld(m,_v),6,0x00e5ff,4,3);} }
    if(m.lat<-lim){ m.lat=-lim; if(m.vlat<0){ m.vlat=-m.vlat*RAIL_REST; thock(-m.vlat); spark(marbleWorld(m,_v),6,0x00e5ff,4,3);} }
    // vertikal: pantulan kecil
    if(m.h>0||m.vh!==0){
      m.vh-=G*1.6*dt; m.h+=m.vh*dt;
      if(m.h<=0){ m.h=0; if(m.vh<-1.5){ thock(-m.vh*0.4); spark(marbleWorld(m,_v),4,0xffffff,3,2);} m.vh=Math.abs(m.vh)*0.4; if(m.vh<0.8)m.vh=0; }
    }
    // rintangan
    hitObstacles(m,dt,t);
    // finish
    if(!m.finished && m.s>=FINISH_S){
      m.finished=true; m.finishTime=raceTime;
      finishers.push(m); confetti(marbleWorld(m,_v)); fanfare();
      if(finishers.length>=FINISH_COUNT) endRace();
    }
    // anti-stuck / auto-respawn tiap frame
    if(!m.finished){
      const prog=m.s-m.lastS;
      if(prog>0.5){ m.lastS=m.s; m.stuckT=0; }
      else { m.stuckT+=dt;
        if(m.stuckT>2.5){ // respawn ke progres terakhir + dorongan
          m.s=Math.max(2,m.lastS-2); m.lat*=0.3; m.h=0; m.vh=0; m.vlat=0; m.vs=6;
          m.stuckT=0; spark(marbleWorld(m,_v),14,0xffd54f,6,6); thock(2);
        }
      }
      // out-of-bounds: jatuh jauh dari lintasan
      if(Math.abs(m.lat)>HALF_W+3||m.h<-4||!isFinite(m.s+m.lat)){
        m.s=Math.max(2,m.lastS); m.lat=0; m.h=2; m.vh=0; m.vlat=0; m.vs=7; m.stuckT=0;
      }
    }
    m.boostCd=Math.max(0,m.boostCd-dt);
  }
  // 2) tabrakan antar kelereng (elastis sederhana)
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    const a=marbles[i],b=marbles[j];
    if(Math.abs(a.s-b.s)>2.5) continue;
    frameAt((a.s+b.s)/2,FR);
    const ax=a.lat,bx=b.lat, as=a.s,bs=b.s;
    let dx=(bs-as), dy=(bx-ax);           // ruang (s,lat) ~ meter
    const d2=dx*dx+dy*dy, rr=MARBLE_R*2;
    if(d2<rr*rr&&d2>1e-6){
      const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, ov=(rr-d)/2;
      a.s-=nx*ov; a.lat-=ny*ov; b.s+=nx*ov; b.lat+=ny*ov;
      const avn=a.vs*nx+a.vlat*ny, bvn=b.vs*nx+b.vlat*ny;
      const imp=(avn-bvn)*0.9;
      if(imp>0){
        a.vs-=nx*imp; a.vlat-=ny*imp; b.vs+=nx*imp; b.vlat+=ny*imp;
        if(imp>2){ thock(imp*0.35); marbleWorld(a,_v); spark(_v,5,0xffffff,4,3); }
      }
    }
  }
}
function hitObstacles(m,dt,t){
  // paku silinder
  for(const p of pegs){
    const ds=m.s-p.s; if(ds>2||ds<-2) continue;
    const dx=ds, dy=m.lat-p.lat, d2=dx*dx+dy*dy, rr=p.r+MARBLE_R;
    if(d2<rr*rr&&d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      m.s=p.s+nx*rr; m.lat=p.lat+ny*rr;
      const vn=m.vs*nx+m.vlat*ny;
      if(vn<0){ m.vs-=1.55*vn*nx; m.vlat-=1.55*vn*ny;
        m.vh=Math.max(m.vh,1.2);
        thock(-vn*0.5); spark(marbleWorld(m,_v),7,0xffb300,5,4); }
    }
  }
  // bumper pinball: pantulan kuat
  for(const b of bumpers){
    const ds=m.s-b.s; if(ds>2.4||ds<-2.4) continue;
    const dx=ds, dy=m.lat-b.lat, d2=dx*dx+dy*dy, rr=b.r+MARBLE_R;
    if(d2<rr*rr&&d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      m.s=b.s+nx*rr; m.lat=b.lat+ny*rr;
      const vn=m.vs*nx+m.vlat*ny;
      if(vn<0){ const kick=1.9;
        m.vs-=kick*vn*nx; m.vlat-=kick*vn*ny;
        m.vs+=2.0; m.vh=Math.max(m.vh,2.2);
        b.ring.scale.setScalar(1.35);
        thock(-vn*0.8); boosterSfx(); spark(marbleWorld(m,_v),12,0xff1744,7,5); }
    }
  }
  // kincir berputar: dorong sesuai arah putar
  for(const sp of spinners){
    const ds=m.s-sp.s; if(ds>4.5||ds<-4.5) continue;
    const c=Math.cos(sp.ang), sn=Math.sin(sp.ang);
    const dl=m.lat-sp.lat;
    const lx=ds*c+dl*sn, ly=-ds*sn+dl*c;   // ke frame lokal bilah
    const hw=0.75;
    if(Math.abs(lx)<sp.half+MARBLE_R && Math.abs(ly)<hw+MARBLE_R){
      const sgn=ly>=0?1:-1;
      const push=(hw+MARBLE_R-Math.abs(ly));
      m.s+=-sn*push*sgn; m.lat+=c*push*sgn;   // kembali ke frame lintasan
      // kecepatan tangensial ujung bilah -> dorong kelereng
      const tv=sp.spd*lx;
      m.vs+=-sn*tv*0.9; m.vlat+=c*tv*0.9;
      m.vs=Math.max(0,m.vs); m.vh=Math.max(m.vh,1.0);
      thock(1.4); spark(marbleWorld(m,_v),6,0xe53935,5,4);
    }
  }
  // booster pad: dorongan kecepatan
  if(m.boostCd<=0) for(const bo of boosters){
    if(m.s>bo.s0&&m.s<bo.s1&&Math.abs(m.lat)<bo.lat){
      m.vs=Math.min(26,m.vs+22*dt+3.2); m.boostCd=0.4;
      boosterSfx(); spark(marbleWorld(m,_v),10,0x00ffcc,6,5);
      bo.glow.material.opacity=0.5;
    }
  }
  for(const bo of boosters) bo.glow.material.opacity=Math.max(0.22,bo.glow.material.opacity-dt*1.2);
}

/* ================= KAMERA SINEMATIK ================= */
let camMode='leader', camLock=null;
const camPos=new THREE.Vector3(0,100,40), camTgt=new THREE.Vector3(0,90,0);
const _p1=new THREE.Vector3(), _p2=new THREE.Vector3();
function leader(){ return [...marbles].sort((a,b)=>b.s-a.s)[0]; }
function updateCamera(dt){
  const k=1-Math.exp(-3.2*dt);   // interpolasi halus anti-getar
  if(camMode==='orbit'){ controls.enabled=true; controls.update(); return; }
  controls.enabled=false;
  let focus=null;
  if(camMode==='lock'&&camLock){ focus=camLock; }
  else if(camMode==='drone'){
    const mid=[...marbles].sort((a,b)=>b.s-a.s).slice(3,9);
    _p1.set(0,0,0); mid.forEach(m=>_p1.add(marbleWorld(m,_p2))); _p1.divideScalar(Math.max(1,mid.length));
    const m0=mid[0]||leader();
    frameAt(m0.s,FR);
    _p2.copy(_p1).addScaledVector(FR.up,26).addScaledVector(FR.tan,-14);
    camPos.lerp(_p2,k); camTgt.lerp(_p1,k);
  } else { // leader / lock
    const m=focus||leader(); if(!m) return;
    marbleWorld(m,_p1); frameAt(m.s,FR);
    _p2.copy(_p1).addScaledVector(FR.tan,-10.5).addScaledVector(FR.up,5.2).addScaledVector(FR.side,3.2);
    camPos.lerp(_p2,k);
    _p2.copy(_p1).addScaledVector(FR.tan,9);
    camTgt.lerp(_p2,k);
  }
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
  // matahari mengikuti aksi (bayangan tajam)
  if(marbles.length){ const f=camLock&&camMode==='lock'?camLock:leader();
    if(f){ marbleWorld(f,_p1); sun.position.set(_p1.x+30,_p1.y+42,_p1.z+18); sun.target.position.copy(_p1); } }
}
function setCamMode(md,lock=null){
  camMode=md; camLock=lock;
  document.querySelectorAll('.cambtn').forEach(b=>b.classList.toggle('on',b.dataset.cam===(md==='lock'?'leader':md)));
  document.querySelectorAll('#board .row').forEach(r=>r.classList.toggle('lock',lock&&+r.dataset.i===lock.i));
  if(md==='orbit'){ controls.target.copy(camTgt); }
}

/* ================= NAME TAGS (billboard 3D->2D) ================= */
const _pv=new THREE.Vector3();
function updateTags(){
  const rank=[...marbles].sort((a,b)=>b.s-a.s);
  rank.forEach((m,r)=>{
    _pv.copy(marbleWorld(m,_p2)); _pv.y+=1.9;
    _pv.project(camera);
    const el=m.tag, behind=_pv.z>1;
    if(behind||state==='setup'){ el.style.display='none'; return; }
    el.style.display='block';
    el.style.left=((_pv.x*0.5+0.5)*innerWidth)+'px';
    el.style.top=((-_pv.y*0.5+0.5)*innerHeight)+'px';
    el.classList.toggle('lead',r===0&&state==='race');
    el.querySelector('.tx').textContent=(r===0?'👑 #1 ':'#'+(r+1)+' ')+m.name;
  });
}
/* ================= TRAIL ================= */
function updateTrails(){
  for(const m of marbles){
    const p=marbleWorld(m,_p2);
    m.trailPts.unshift(p.x,p.y,p.z);
    if(m.trailPts.length>m.trailN*3) m.trailPts.length=m.trailN*3;
    const posA=m.trail.geometry.attributes.position, colA=m.trail.geometry.attributes.color;
    const c=new THREE.Color(m.color), n=m.trailPts.length/3;
    for(let i=0;i<m.trailN;i++){
      const j=Math.min(i,n-1)*3;
      posA.setXYZ(i,m.trailPts[j]??p.x,m.trailPts[j+1]??p.y,m.trailPts[j+2]??p.z);
      const f=Math.pow(1-i/m.trailN,1.6)*(m.vs>7?0.9:0.0);
      colA.setXYZ(i,c.r*f,c.g*f,c.b*f);
    }
    posA.needsUpdate=true; colA.needsUpdate=true;
    m.trail.visible=m.vs>7&&state==='race';
    // putaran bola sesuai kecepatan (menggelinding)
    frameAt(m.s,FR);
    const w=m.vs/MARBLE_R;
    m.mesh.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(FR.side,-w*0.016));
  }
}

/* ================= STATE & UI ================= */
let state='setup', raceTime=0, finishers=[], recArmed=false;
let recorder=null, recChunks=[], recStartT=0, recUrl=null, recTimer=null;

function getNames(){
  const lines=$('names').value.split('\n').map(s=>s.trim().toUpperCase()).filter(Boolean);
  const cnt=clamp(parseInt($('cnt').value)||12,4,16);
  while(lines.length<cnt) lines.push('P'+(lines.length+1));
  return lines.slice(0,cnt);
}
function newRace(){
  initAudio();
  buildTrack(); buildTrackMesh(); buildObstacles();
  const names=getNames();
  buildMarbles(names);
  finishers=[]; raceTime=0; state='countdown';
  $('setup').classList.add('hide');
  $('podium').classList.remove('on');
  $('btnDl2').style.display='none'; $('dlWrap').classList.remove('on');
  if(recUrl){ URL.revokeObjectURL(recUrl); recUrl=null; }
  setCamMode('leader');
  // posisi awal kamera di garis start
  frameAt(10,FR); marbleWorld(marbles[0],_p1);
  camPos.copy(_p1).addScaledVector(FR.tan,-14).addScaledVector(FR.up,8);
  camTgt.copy(_p1).addScaledVector(FR.tan,10);
  camera.position.copy(camPos); camera.lookAt(camTgt);
  // countdown 3-2-1-GO
  const el=$('count'); el.classList.add('on');
  let c=3; el.textContent=c; countBeep(false);
  const iv=setInterval(()=>{
    c--; if(c>0){ el.textContent=c; countBeep(false); }
    else { clearInterval(iv); el.textContent='GO!'; countBeep(true);
      setTimeout(()=>el.classList.remove('on'),700);
      state='race';
      marbles.forEach(m=>{ m.vs=4.5; m.lastS=m.s; });
      if(recArmed) startRec();
    }
  },900);
  updateBoard();
}
function updateBoard(){
  const rank=[...marbles].sort((a,b)=>b.s-a.s);
  $('leader').textContent='👑 '+(rank[0]?rank[0].name:'-');
  $('board').innerHTML='🏁 <b>Live</b><br>'+rank.map((m,i)=>
    '<div class="row'+(i<3?' r'+(i+1):'')+(camLock===m?' lock':'')+'" data-i="'+m.i+'">'+
    (i+1)+'. <span style="color:'+m.color+'">●</span> '+m.name+
    (m.finished?' <span style="color:#ffe082">'+fmtTime(m.finishTime)+'</span>':'')+'</div>').join('');
  document.querySelectorAll('#board .row').forEach(r=>{
    r.onclick=()=>{ const m=marbles[+r.dataset.i]; setCamMode('lock',m); };
  });
}
function endRace(){
  state='podium';
  stopRec();
  fanfare();
  const rank=[...marbles].sort((a,b)=>{
    if(a.finished&&b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1; if(b.finished) return 1; return b.s-a.s;
  });
  $('winName').textContent='🥇 Pemenang: '+rank[0].name+' — '+fmtTime(rank[0].finishTime||raceTime);
  $('podList').innerHTML=rank.map((m,i)=>
    '<div class="pr"><span class="pos">'+(i+1)+'</span>'+
    '<span class="pdot" style="background:'+m.color+'"></span><span>'+m.name+'</span>'+
    '<span class="tm">'+(m.finished?fmtTime(m.finishTime):Math.round(m.s/FINISH_S*100)+'%')+'</span></div>').join('');
  $('podium').classList.add('on');
  if(recUrl){ $('btnDl2').style.display='block'; }
  updateBoard();
}
// victory cam: orbit mengelilingi pemenang
let vicAng=0;
function victoryCam(dt){
  const w=[...marbles].sort((a,b)=>{
    if(a.finished&&b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1; if(b.finished) return 1; return b.s-a.s; })[0];
  if(!w) return;
  marbleWorld(w,_p1); vicAng+=dt*0.55;
  _p2.set(_p1.x+Math.cos(vicAng)*11, _p1.y+4.5, _p1.z+Math.sin(vicAng)*11);
  const k=1-Math.exp(-2.5*dt);
  camPos.lerp(_p2,k); camTgt.lerp(_p1,k);
  camera.position.copy(camPos); camera.lookAt(camTgt);
}

/* ================= RECORDER ================= */
function pickMime(){
  const cands=['video/mp4','video/webm;codecs=vp9','video/webm'];
  if(window.MediaRecorder) for(const t of cands) if(MediaRecorder.isTypeSupported(t)) return t;
  return '';
}
function startRec(){
  try{
    initAudio();
    const vs=renderer.domElement.captureStream(30);
    const tracks=[...vs.getVideoTracks(),...mediaDest.stream.getAudioTracks()];
    const mime=pickMime();
    recorder=new MediaRecorder(new MediaStream(tracks), mime?{mimeType:mime,videoBitsPerSecond:8e6}:undefined);
    recChunks=[];
    recorder.ondataavailable=e=>{ if(e.data.size) recChunks.push(e.data); };
    recorder.onstop=()=>{
      const blob=new Blob(recChunks,{type:mime||'video/webm'});
      recUrl=URL.createObjectURL(blob);
      $('dlWrap').classList.add('on'); $('btnDl2').style.display='block';
    };
    recorder.start(500);
    recStartT=Date.now();
    $('recBadge').classList.add('on');
    recTimer=setInterval(()=>{ $('recTime').textContent='REC '+fmtTime((Date.now()-recStartT)/1000).slice(0,5); },250);
  }catch(e){ $('err').style.display='block'; $('err').textContent='⚠ Rekam gagal: '+e.message; }
}
function stopRec(){
  if(recorder&&recorder.state!=='inactive'){ try{recorder.stop();}catch(e){} }
  recorder=null; clearInterval(recTimer);
  $('recBadge').classList.remove('on');
}
function downloadRec(){ if(!recUrl) return;
  const a=document.createElement('a'); a.href=recUrl;
  a.download='balap-kelereng-3d.'+(pickMime().includes('mp4')?'mp4':'webm');
  a.click();
}

/* ================= UI WIRING ================= */
$('btnGo').onclick=()=>{ $('btnStart').disabled=false; newRace(); };
$('btnStart').onclick=()=>{ if(state==='setup'||state==='podium') newRace(); };
$('btnStart').disabled=true;
$('btnShuffle').onclick=()=>{ seed=(Math.random()*1e9)|0; buildTrack(); buildTrackMesh(); buildObstacles(); };
$('btnArmRec').onclick=e=>{ recArmed=!recArmed;
  e.target.textContent='⏺ REKAM: '+(recArmed?'ON':'OFF');
  e.target.classList.toggle('armed',recArmed);
  $('btnRec').classList.toggle('armed',recArmed); };
$('btnRec').onclick=()=>$('btnArmRec').click();
$('btnSound').onclick=e=>{ soundOn=!soundOn; e.target.textContent=soundOn?'🔊':'🔇';
  if(master) master.gain.value=soundOn?0.5:0; };
$('btnCam').onclick=()=>{
  const order=['leader','drone','orbit'];
  setCamMode(order[(order.indexOf(camMode==='lock'?'leader':camMode)+1)%3]);
};
document.querySelectorAll('.cambtn').forEach(b=>b.onclick=()=>setCamMode(b.dataset.cam));
$('btnDl').onclick=downloadRec; $('btnDl2').onclick=downloadRec;
$('btnAgain').onclick=()=>{ $('podium').classList.remove('on'); newRace(); };
$('cnt').onchange=e=>{ const v=clamp(parseInt(e.target.value)||12,4,16); e.target.value=v;
  const cur=$('names').value.split('\n').filter(s=>s.trim());
  while(cur.length<v) cur.push('P'+(cur.length+1));
  $('names').value=cur.slice(0,v).join('\n'); };
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ================= MAIN LOOP ================= */
const clock=new THREE.Clock();
let boardT=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,clock.getDelta());
  const t=clock.elapsedTime;
  if(state==='race'){
    // substep fisika agar stabil di semua framerate
    const n=Math.max(1,Math.min(4,Math.round(dt/0.0167)));
    const h=dt/n;
    for(let k=0;k<n;k++) physStep(h,t);
    raceTime+=dt;
    $('timer').textContent='⏱ '+fmtTime(raceTime);
    if(rollGain&&AC) rollGain.gain.value=soundOn?clamp(leader().vs/22,0,0.5)*0.35:0;
    boardT+=dt; if(boardT>0.5){ boardT=0; updateBoard(); }
    if(raceTime>RACE_TIMEOUT) endRace();
  } else if(state==='podium'){ victoryCam(dt); }
  // animasi rintangan
  for(const sp of spinners){ sp.ang+=sp.spd*dt; sp.grp.rotation.y=sp.ang; }
  for(const b of bumpers){ const s=b.ring.scale.x; if(s>1) b.ring.scale.setScalar(Math.max(1,s-dt*3)); }
  for(const bo of boosters){ bo.mesh.material.opacity=0.8+0.2*Math.sin(t*6); }
  stepParticles(dt);
  // sinkron mesh kelereng
  for(const m of marbles){ marbleWorld(m,_p1); m.mesh.position.copy(_p1); }
  updateTrails();
  if(state==='race'||state==='podium') updateCamera(dt); else { controls.enabled=false; }
  updateTags();
  renderer.render(scene,camera);
}

// init tampilan awal (setup): bangun lintasan preview
buildTrack(); buildTrackMesh(); buildObstacles(); buildMarbles(getNames());
frameAt(30,FR); marbleWorld(marbles[0],_p1);
camera.position.copy(_p1).addScaledVector(FR.tan,-26).addScaledVector(FR.up,14);
camera.lookAt(_p1); camPos.copy(camera.position); camTgt.copy(_p1);
updateBoard();
loop();
</script>
