<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= KONFIG ================= */
// 7 corak kelereng kaca tradisional
const PATTERNS=[
  {key:'cateye', name:'MATA KUCING', base:'#f4f8ff', swirl:'#e53935'},
  {key:'susu',   name:'SUSU',        base:'#fdfdf5', swirl:'#1e88e5'},
  {key:'marmer', name:'MERAH MARMER',base:'#c62828', swirl:'#ffffff'},
  {key:'laut',   name:'BIRU LAUT',   base:'#0d47a1', swirl:'#80d8ff'},
  {key:'zamrud', name:'HIJAU ZAMRUD',base:'#1b7a3d', swirl:'#b9f6ca'},
  {key:'amber',  name:'KUNING AMBER',base:'#ef8f00', swirl:'#fff3c4'},
  {key:'ungu',   name:'UNGU KACA',   base:'#5e2b97', swirl:'#e1bee7'},
];
const G=14.0, ROLL_F=0.28, DRAG=0.0035, RAIL_REST=0.55;
const TRACK_W=8, HALF_W=4, MARBLE_R=0.55;
const FINISH_COUNT=3, RACE_TIMEOUT=240;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function fmtTime(s){ const m=Math.floor(s/60), ss=(s%60);
  return String(m).padStart(2,'0')+':'+ss.toFixed(1).padStart(4,'0'); }

/* ================= AUDIO ALAMI (klak kaca & kayu) ================= */
let AC=null, master=null, mediaDest=null, soundOn=true, rollGain=null, noiseBuf=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.5;
  master.connect(AC.destination);
  mediaDest=AC.createMediaStreamDestination(); master.connect(mediaDest);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=400;
  rollGain=AC.createGain(); rollGain.gain.value=0;
  src.connect(f); f.connect(rollGain); rollGain.connect(master); src.start();
}
// bunyi "klak/tik" kaca: bandpass noise burst + sine ping 0.03-0.05s
function clack(intensity=1, woody=false){
  if(!AC||!soundOn) return;
  const t=AC.currentTime, v=clamp(0.22*intensity,0.03,0.5);
  const n=AC.createBufferSource(); n.buffer=noiseBuf;
  n.playbackRate.value=0.9+Math.random()*0.3;
  const bp=AC.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=woody?900+Math.random()*300:2400+Math.random()*1400;
  bp.Q.value=7;
  const g=AC.createGain();
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  n.connect(bp); bp.connect(g); g.connect(master); n.start(t); n.stop(t+0.08);
  const o=AC.createOscillator(); o.type='triangle';
  o.frequency.value=woody?420+Math.random()*120:1700+Math.random()*900;
  const g2=AC.createGain();
  g2.gain.setValueAtTime(v*0.7,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.035);
  o.connect(g2); g2.connect(master); o.start(t); o.stop(t+0.06);
}
// peluit start: sine sweep naik
function whistle(){
  if(!AC||!soundOn) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(2100,t);
  o.frequency.exponentialRampToValueAtTime(3400,t+0.45);
  g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.6);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.65);
}
// sorak kemenangan: arpeggio ceria + tepuk tangan (noise swell)
function cheer(){
  if(!AC||!soundOn) return;
  [523,659,784,1047,1319].forEach((fr,i)=>{
    const t=AC.currentTime+i*0.13, o=AC.createOscillator(), g=AC.createGain();
    o.type='triangle'; o.frequency.value=fr;
    g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.35);
  });
  for(let k=0;k<14;k++){
    const t=AC.currentTime+Math.random()*1.1;
    const n=AC.createBufferSource(); n.buffer=noiseBuf;
    const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=1.2;
    const g=AC.createGain();
    g.gain.setValueAtTime(0.10,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(t); n.stop(t+0.12);
  }
}
function countTick(fin){
  if(!AC||!soundOn) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.value=fin?880:660;
  g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+(fin?0.4:0.12));
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.45);
}

/* ================= TRACK BUILDER (jalur kayu berkelok) ================= */
let seed=(Math.random()*1e9)|0;
function srand(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
const track={pts:[],total:0,pos:[],tan:[],side:[],up:[],curve:null,step:0.5};
const zones={};
let FINISH_S=0;
function buildTrack(){
  track.pts.length=0;
  let x=0,y=92,z=0,ang=0;
  const push=()=>track.pts.push(new THREE.Vector3(x,y,z));
  push();
  function seg(len,dAngDeg,dy,jitter=0){
    const dAng=dAngDeg*Math.PI/180, n=Math.max(2,Math.round(len/8));
    for(let i=0;i<n;i++){
      ang+=dAng/n+(jitter?(srand()-0.5)*jitter/n:0);
      const ds=len/n;
      x+=Math.sin(ang)*ds; z+=Math.cos(ang)*ds; y+=dy/n;
      push();
    }
  }
  const jz=()=>(srand()-0.5)*24;
  seg(50,0,-3); seg(70,55+jz()*0.4,-8); seg(95,-12,-6); seg(60,-52+jz()*0.4,-7);
  seg(95,10,-6); seg(115,0,0); seg(55,-18,-26); seg(85,12,-4);
  seg(95,-14,-6); seg(50,32,-4); seg(50,-32,-4); seg(65,0,-2);
  let acc=0; const tmpS=[];
  for(let i=1;i<track.pts.length;i++){ acc+=track.pts[i].distanceTo(track.pts[i-1]); tmpS.push(acc); }
  for(let i=1;i<track.pts.length;i++){
    const s=tmpS[i-1];
    if(s>375&&s<490) track.pts[i].y+=2.0*Math.sin((s-375)/115*Math.PI*4);
  }
  track.curve=new THREE.CatmullRomCurve3(track.pts);
  track.total=track.curve.getLength();
  const N=Math.ceil(track.total/track.step)+1;
  track.pos=new Array(N); track.tan=new Array(N); track.side=new Array(N); track.up=new Array(N);
  const up=new THREE.Vector3(0,1,0),T=new THREE.Vector3(),S=new THREE.Vector3(),U=new THREE.Vector3();
  for(let i=0;i<N;i++){
    const u=clamp(i*track.step/track.total,0,1);
    const p=track.curve.getPointAt(u);
    track.curve.getTangentAt(u,T);
    S.crossVectors(up,T).normalize(); if(S.lengthSq()<0.5) S.set(1,0,0);
    U.crossVectors(T,S).normalize();
    track.pos[i]=p.clone(); track.tan[i]=T.clone(); track.side[i]=S.clone(); track.up[i]=U.clone();
  }
  FINISH_S=track.total-22;
  zones.pegs=[128,215]; zones.spinners=[278,368]; zones.boost=[528,608]; zones.bump=[618,708];
}
function frameAt(s,out){
  const i=clamp(Math.round(s/track.step),0,track.pos.length-1);
  out.pos.copy(track.pos[i]); out.tan.copy(track.tan[i]);
  out.side.copy(track.side[i]); out.up.copy(track.up[i]);
  return out;
}

/* ================= SCENE SIANG CERAH ================= */
const canvas=$('c3d');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));   // optimasi 60fps
renderer.shadowMap.enabled=false;                                   // ganti blob shadow
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setSize(innerWidth,innerHeight);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fd4f5);          // langit biru cerah
scene.fog=new THREE.Fog(0xc4e4fa,80,340);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.1,1200);
camera.position.set(0,100,40);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.maxDistance=220; controls.minDistance=4; controls.enabled=false;

// pencahayaan matahari alami
scene.add(new THREE.HemisphereLight(0xcfe8ff,0x8a7a5a,0.95));
const sun=new THREE.DirectionalLight(0xfff1d6,1.5);   // hangat
sun.position.set(60,90,30); scene.add(sun);

// taman hijau di bawah + awan lembut
{
  const g=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),
    new THREE.MeshStandardMaterial({color:0x7cc46a,roughness:1}));
  g.rotation.x=-Math.PI/2; g.position.y=-14; scene.add(g);
  const grid=new THREE.GridHelper(1200,60,0x5da24f,0x6fb45f);
  grid.position.y=-13.5; grid.material.transparent=true; grid.material.opacity=0.35; scene.add(grid);
  // awan: sprite blob putih
  const cc=document.createElement('canvas'); cc.width=cc.height=128;
  const cx=cc.getContext('2d');
  const gr=cx.createRadialGradient(64,64,8,64,64,62);
  gr.addColorStop(0,'rgba(255,255,255,.95)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  cx.fillStyle=gr; cx.fillRect(0,0,128,128);

function woodTexture(){

let trackGroup=null;
function checkerTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d'),n=8,s=128/n;
  for(let r=0;r<n;r++)for(let q=0;q<n;q++){ x.fillStyle=(r+q)%2?'#161616':'#f7f7f7'; x.fillRect(q*s,r*s,s,s); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
function buildTrackMesh(){
  if(trackGroup){ scene.remove(trackGroup); trackGroup.traverse(o=>{o.geometry&&o.geometry.dispose();}); }
  trackGroup=new THREE.Group(); scene.add(trackGroup);
  const N=track.pos.length,W2=HALF_W;
  const vtx=new Float32Array(N*2*3),nrm=new Float32Array(N*2*3),uv=new Float32Array(N*2*2);
  const F={pos:new THREE.Vector3(),tan:new THREE.Vector3(),side:new THREE.Vector3(),up:new THREE.Vector3()};
  const curv=new Float32Array(N);
  for(let i=0;i<N;i++){
    frameAt(i*track.step,F);
    vtx.set([F.pos.x-F.side.x*W2,F.pos.y-F.side.y*W2,F.pos.z-F.side.z*W2,
             F.pos.x+F.side.x*W2,F.pos.y+F.side.y*W2,F.pos.z+F.side.z*W2],i*6);
    nrm.set([F.up.x,F.up.y,F.up.z,F.up.x,F.up.y,F.up.z],i*6);
    uv.set([0,i*track.step/6,1,i*track.step/6],i*4);
    if(i>0&&i<N-1){ const a=track.tan[i-1],b=track.tan[i+1];
      curv[i]=Math.acos(clamp(a.dot(b),-1,1))/(2*track.step); }
  }
  const idx=[];
  for(let i=0;i<N-1;i++){ const a=i*2; idx.push(a,a+1,a+2,a+1,a+3,a+2); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(vtx,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setIndex(idx);
  const wt=woodTexture(); wt.repeat.set(1,120);
  const road=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:wt,roughness:0.72,metalness:0.02}));
  trackGroup.add(road);
  // list kayu di tepi papan (plank edges)
  const edgeMat=new THREE.MeshStandardMaterial({color:0x8a5a28,roughness:0.8});
  [-1,1].forEach(sg=>{
    const ev=[],eidx=[];
    for(let i=0;i<N;i++){
      frameAt(i*track.step,F);
      const bx=F.pos.x+F.side.x*W2*sg,by=F.pos.y+F.side.y*W2*sg,bz=F.pos.z+F.side.z*W2*sg;
      ev.push(bx,by,bz,bx,by-0.7,bz);
      if(i<N-1){ const a=i*2; eidx.push(a,a+2,a+1,a+1,a+2,a+3); }
    }
    const eg=new THREE.BufferGeometry();
    eg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(ev),3));
    eg.setIndex(eidx); eg.computeVertexNormals();
    trackGroup.add(new THREE.Mesh(eg,new THREE.MeshStandardMaterial({color:0x8a5a28,roughness:0.8,side:THREE.DoubleSide})));
  });
  // dinding pembatas kayu (lebih tinggi di tikungan tajam)
  const wallMat=new THREE.MeshStandardMaterial({color:0xbc6c25,roughness:0.75});
  const capMat=new THREE.MeshStandardMaterial({color:0x8a4d16,roughness:0.7});
  [-1,1].forEach(sg=>{
    const wv=[],widx=[];
    const capPts=[];
    for(let i=0;i<N;i++){
      frameAt(i*track.step,F);
      const hgt=1.0+clamp(curv[i]*22,0,1.2);
      const bx=F.pos.x+F.side.x*W2*sg,by=F.pos.y+F.side.y*W2*sg,bz=F.pos.z+F.side.z*W2*sg;
      wv.push(bx,by,bz,bx+F.up.x*hgt,by+F.up.y*hgt,bz+F.up.z*hgt);
      if(i<N-1){ const a=i*2; widx.push(a,a+2,a+1,a+1,a+2,a+3); }
      if(i%2===0) capPts.push(new THREE.Vector3(bx+F.up.x*(hgt+0.1),by+F.up.y*(hgt+0.1),bz+F.up.z*(hgt+0.1)));
    }
    const wg=new THREE.BufferGeometry();
    wg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(wv),3));
    wg.setIndex(widx); wg.computeVertexNormals();
    trackGroup.add(new THREE.Mesh(wg,new THREE.MeshStandardMaterial({color:0xbc6c25,roughness:0.75,side:THREE.DoubleSide})));
    const cap=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(capPts),Math.ceil(N/2),0.16,8),capMat);
    trackGroup.add(cap);
  });
  // garis start & finish: bendera hitam-putih di atas kayu + gapura kayu
  const chk=checkerTex();
  function gateAt(s,label){
    frameAt(s,F);
    const w=HALF_W*2,d=3;
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({map:chk.clone()}));
    m.material.map.repeat.set(6,1); m.material.map.needsUpdate=true;
    m.position.copy(F.pos).addScaledVector(F.up,0.07);
    const look=new THREE.Matrix4().lookAt(new THREE.Vector3(),F.tan.clone().negate(),F.up);
    m.quaternion.setFromRotationMatrix(look); m.rotateX(-Math.PI/2);
    trackGroup.add(m);
    const poleG=new THREE.CylinderGeometry(0.24,0.3,7.4,10);
    const poleM=new THREE.MeshStandardMaterial({color:0x7a4d20,roughness:0.7});
    [-1,1].forEach(sgg=>{
      const p=new THREE.Mesh(poleG,poleM);
      p.position.copy(F.pos).addScaledVector(F.side,sgg*(HALF_W+0.7)).addScaledVector(F.up,3.7);
      trackGroup.add(p);
    });
    const bw=HALF_W*2+2.6;
    const beam=new THREE.Mesh(new THREE.BoxGeometry(bw,0.5,0.5),poleM);
    beam.position.copy(F.pos).addScaledVector(F.up,7.2);
    const bl=new THREE.Matrix4().lookAt(new THREE.Vector3(),F.tan.clone().negate(),F.up);
    beam.quaternion.setFromRotationMatrix(bl); beam.rotateY(Math.PI/2);
    trackGroup.add(beam);
    const cv=document.createElement('canvas'); cv.width=512; cv.height=96;
    const cx2=cv.getContext('2d');
    cx2.fillStyle='#fdf6e3'; cx2.fillRect(0,0,512,96);
    cx2.fillStyle='#7a4d20'; cx2.font='900 60px Trebuchet MS';
    cx2.textAlign='center'; cx2.textBaseline='middle'; cx2.fillText(label,256,52);
    const tx=new THREE.CanvasTexture(cv);
    const tm=new THREE.Mesh(new THREE.PlaneGeometry(bw*0.9,1.5),
      new THREE.MeshBasicMaterial({map:tx,side:THREE.DoubleSide}));
    tm.position.copy(F.pos).addScaledVector(F.up,6.1);
    tm.quaternion.setFromRotationMatrix(bl);
    trackGroup.add(tm);
  }
  gateAt(8,'START'); gateAt(FINISH_S,'FINISH');
}

function glassTexture(pat){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d');
  x.fillStyle=pat.base; x.fillRect(0,0,256,256);
  const R=(a,b)=>a+Math.random()*(b-a);
  if(pat.key==='cateye'){
    // mata kucing: pusaran putih + inti warna
    for(let k=0;k<6;k++){ x.strokeStyle='rgba(255,255,255,.9)'; x.lineWidth=R(6,14); x.beginPath();
      const y0=20+k*40; for(let px=0;px<=256;px+=8) x.lineTo(px,y0+Math.sin(px*0.05+k*2)*18); x.stroke(); }
    const g=x.createRadialGradient(128,128,6,128,128,60);
    g.addColorStop(0,pat.swirl); g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g; x.fillRect(0,0,256,256);
  } else if(pat.key==='susu'){
    for(let k=0;k<7;k++){ x.strokeStyle=pat.swirl; x.globalAlpha=0.75; x.lineWidth=R(8,18); x.beginPath();
      const y0=14+k*34; for(let px=0;px<=256;px+=8) x.lineTo(px,y0+Math.sin(px*0.04+k)*24); x.stroke(); }
    x.globalAlpha=1;
  } else {
    // marmer: urat kontras acak
    for(let k=0;k<9;k++){ x.strokeStyle='rgba(255,255,255,.8)'; x.lineWidth=R(3,9); x.beginPath();
      let px=Math.random()*256,py=Math.random()*256; x.moveTo(px,py);
      for(let s2=0;s2<6;s2++){ px+=R(-70,70); py+=R(-70,70); x.lineTo(px,py); } x.stroke(); }
    for(let k=0;k<4;k++){ x.strokeStyle=pat.swirl; x.globalAlpha=0.5; x.lineWidth=R(10,20); x.beginPath();
      const y0=Math.random()*256; for(let px=0;px<=256;px+=8) x.lineTo(px,y0+Math.sin(px*0.06+k)*20); x.stroke(); }
    x.globalAlpha=1;
  }
  // highlight kaca
  const hg=x.createLinearGradient(0,0,256,256);
  hg.addColorStop(0,'rgba(255,255,255,.35)'); hg.addColorStop(0.4,'rgba(255,255,255,0)');
  x.fillStyle=hg; x.fillRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

const marbles=[];

/* ================= FISIKA (substep 1/60 stabil) ================= */
const FR={pos:new THREE.Vector3(),tan:new THREE.Vector3(),side:new THREE.Vector3(),up:new THREE.Vector3()};
const _v=new THREE.Vector3(), _p=new THREE.Vector3(), _q=new THREE.Quaternion();
function marbleWorld(m,out){ frameAt(m.s,FR);
  out.copy(FR.pos).addScaledVector(FR.side,m.lat).addScaledVector(FR.up,MARBLE_R+m.h); return out; }

function physStep(dt){
  const n=marbles.length;
  for(const m of marbles){
    if(m.finished) m.vs=Math.max(0,m.vs-8*dt);
    frameAt(m.s,FR);
    const slope=FR.tan.y;
    let a=-G*slope-ROLL_F*Math.sign(m.vs)-DRAG*m.vs*Math.abs(m.vs);
    if(m.finished) a-=4;
    m.vs=Math.max(0,m.vs+a*dt);
    m.s+=m.vs*dt;
    m.vlat*=Math.max(0,1-2.2*dt);
    m.lat+=m.vlat*dt;
    const lim=HALF_W-MARBLE_R-0.15;
    if(m.lat>lim){ m.lat=lim; if(m.vlat>0){ m.vlat=-m.vlat*RAIL_REST; clack(0.7,true); spark(marbleWorld(m,_v),5,0xd8b13a,4,3);} }
    if(m.lat<-lim){ m.lat=-lim; if(m.vlat<0){ m.vlat=-m.vlat*RAIL_REST; clack(0.7,true); spark(marbleWorld(m,_v),5,0xd8b13a,4,3);} }
    if(m.h>0||m.vh!==0){
      m.vh-=G*1.6*dt; m.h+=m.vh*dt;
      if(m.h<=0){ m.h=0; if(m.vh<-1.5){ clack(0.5,true); spark(marbleWorld(m,_v),4,0xffffff,3,2);} m.vh=Math.abs(m.vh)*0.4; if(m.vh<0.8)m.vh=0; }
    }
    hitObstacles(m,dt);
    if(!m.finished&&m.s>=FINISH_S){
      m.finished=true; m.finishTime=raceTime;
      finishers.push(m); confetti(marbleWorld(m,_v)); cheer();
      if(finishers.length>=FINISH_COUNT) endRace();
    }
    if(!m.finished){
      if(m.s-m.lastS>0.5){ m.lastS=m.s; m.stuckT=0; }
      else{ m.stuckT+=dt;
        if(m.stuckT>2.5){
          m.s=Math.max(2,m.lastS-2); m.lat*=0.3; m.h=0; m.vh=0; m.vlat=0; m.vs=6;
          m.stuckT=0; spark(marbleWorld(m,_v),12,0xffd54f,6,6); clack(1.2);
        } }
      if(Math.abs(m.lat)>HALF_W+3||m.h<-4||!isFinite(m.s+m.lat)){
        m.s=Math.max(2,m.lastS); m.lat=0; m.h=2; m.vh=0; m.vlat=0; m.vs=7; m.stuckT=0;
      }
    }
    m.boostCd=Math.max(0,m.boostCd-dt);
    // bola benar-benar menggelinding: rotasi sesuai kecepatan linear
    if(m.vs>0.01){
      _q.setFromAxisAngle(FR.side,-(m.vs/MARBLE_R)*dt);
      m.mesh.quaternion.premultiply(_q);
    }
  }
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    const a=marbles[i],b=marbles[j];
    if(Math.abs(a.s-b.s)>2.5) continue;
    const dx=b.s-a.s, dy=b.lat-a.lat, d2=dx*dx+dy*dy, rr=MARBLE_R*2;
    if(d2<rr*rr&&d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(rr-d)/2;
      a.s-=nx*ov; a.lat-=ny*ov; b.s+=nx*ov; b.lat+=ny*ov;
      const avn=a.vs*nx+a.vlat*ny, bvn=b.vs*nx+b.vlat*ny, imp=(avn-bvn)*0.9;
      if(imp>0){ a.vs-=nx*imp; a.vlat-=ny*imp; b.vs+=nx*imp; b.vlat+=ny*imp;
        if(imp>2){ clack(imp*0.3); spark(marbleWorld(a,_v),5,0xffffff,4,3); } }
    }
  }
}
function hitObstacles(m,dt){
  for(const p of pegs){
    const ds=m.s-p.s; if(ds>2||ds<-2) continue;
    const dx=ds,dy=m.lat-p.lat,d2=dx*dx+dy*dy,rr=p.r+MARBLE_R;
    if(d2<rr*rr&&d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      m.s=p.s+nx*rr; m.lat=p.lat+ny*rr;
      const vn=m.vs*nx+m.vlat*ny;
      if(vn<0){ m.vs-=1.55*vn*nx; m.vlat-=1.55*vn*ny; m.vh=Math.max(m.vh,1.2);
        clack(-vn*0.5); spark(marbleWorld(m,_v),7,0xffd54f,5,4); }
    }
  }
  for(const b of bumpers){
    const ds=m.s-b.s; if(ds>2.4||ds<-2.4) continue;
    const dx=ds,dy=m.lat-b.lat,d2=dx*dx+dy*dy,rr=b.r+MARBLE_R;
    if(d2<rr*rr&&d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      m.s=b.s+nx*rr; m.lat=b.lat+ny*rr;
      const vn=m.vs*nx+m.vlat*ny;
      if(vn<0){ m.vs-=1.9*vn*nx; m.vlat-=1.9*vn*ny; m.vs+=2.0; m.vh=Math.max(m.vh,2.2);
        b.ring.scale.setScalar(1.35);
        clack(-vn*0.8,true); spark(marbleWorld(m,_v),12,0xffffff,7,5); }
    }
  }
  for(const sp of spinners){
    const ds=m.s-sp.s; if(ds>4.5||ds<-4.5) continue;
    const c=Math.cos(sp.ang),sn=Math.sin(sp.ang),dl=m.lat-sp.lat;
    const lx=ds*c+dl*sn,ly=-ds*sn+dl*c,hw=0.75;
    if(Math.abs(lx)<sp.half+MARBLE_R&&Math.abs(ly)<hw+MARBLE_R){
      const sgn=ly>=0?1:-1,push=(hw+MARBLE_R-Math.abs(ly));
      m.s+=-sn*push*sgn; m.lat+=c*push*sgn;
      const tv=sp.spd*lx;
      m.vs=Math.max(0,m.vs-sn*tv*0.9); m.vlat+=c*tv*0.9; m.vh=Math.max(m.vh,1.0);
      clack(1.2,true); spark(marbleWorld(m,_v),6,0xffffff,5,4);
    }
  }
  if(m.boostCd<=0) for(const bo of boosters){
    if(m.s>bo.s0&&m.s<bo.s1&&Math.abs(m.lat)<bo.lat){
      m.vs=Math.min(26,m.vs+22*dt+3.2); m.boostCd=0.4;
      spark(marbleWorld(m,_v),10,0x2ecc71,6,5); clack(0.8);
    }
  }
}

/* ================= PARTIKEL ================= */
const PMAX=380;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(PMAX*3),pCol=new Float32Array(PMAX*3);
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const points=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.5,vertexColors:true,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
points.frustumCulled=false; scene.add(points);
const parts=[]; for(let i=0;i<PMAX;i++) parts.push({life:0,x:0,y:0,z:0,vx:0,vy:0,vz:0,r:1,g:1,b:1});
let pIdx=0;
function spark(p,n,color,spd=6,up=4){
  const c=new THREE.Color(color);
  for(let k=0;k<n;k++){ const q=parts[pIdx]; pIdx=(pIdx+1)%PMAX;
    q.life=0.5+Math.random()*0.5; q.x=p.x; q.y=p.y; q.z=p.z;
    const a=Math.random()*6.28,e=Math.random()*spd;
    q.vx=Math.cos(a)*e; q.vz=Math.sin(a)*e; q.vy=Math.random()*up;
    q.r=c.r; q.g=c.g; q.b=c.b; }
}
function confetti(p){ [0xffd54f,0xef5350,0x29b6f6,0x66bb6a,0xffffff].forEach(cc=>{ for(let k=0;k<12;k++) spark(p,1,cc,9,10); }); }
function stepParticles(dt){
  for(let i=0;i<PMAX;i++){ const q=parts[i];
    if(q.life>0){ q.life-=dt; q.vy-=12*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt; }
    const f=clamp(q.life*2,0,1);
    pPos[i*3]=q.x; pPos[i*3+1]=q.y; pPos[i*3+2]=q.z;
    pCol[i*3]=q.r*f; pCol[i*3+1]=q.g*f; pCol[i*3+2]=q.b*f;
  }
  pGeo.attributes.position.needsUpdate=true; pGeo.attributes.color.needsUpdate=true;
}

let camMode='leader',camLock=null;
const camPos=new THREE.Vector3(0,100,40),camTgt=new THREE.Vector3(0,90,0);
const _p1=new THREE.Vector3(),_p2=new THREE.Vector3();
function leader(){ return [...marbles].sort((a,b)=>b.s-a.s)[0]; }
function top2mid(out){
  const r=[...marbles].sort((a,b)=>b.s-a.s);
  if(r.length>=2){ marbleWorld(r[0],_p1); marbleWorld(r[1],_p2); out.copy(_p1).add(_p2).multiplyScalar(0.5); }
  else if(r.length) marbleWorld(r[0],out);
  return out;
}
function updateCamera(){
  if(camMode==='orbit'){ controls.enabled=true; controls.update(); return; }
  controls.enabled=false;
  let focus=null;
  if(camMode==='lock'&&camLock) focus=camLock;
  if(camMode==='drone'){
    const mid=[...marbles].sort((a,b)=>b.s-a.s).slice(3,9);
    _p1.set(0,0,0); mid.forEach(m=>_p1.add(marbleWorld(m,_p2))); _p1.divideScalar(Math.max(1,mid.length));
    const m0=mid[0]||leader(); if(m0){ frameAt(m0.s,FR);
      _p2.copy(_p1).addScaledVector(FR.up,26).addScaledVector(FR.tan,-14);
      camPos.lerp(_p2,0.08); camTgt.lerp(_p1,0.1); }
  } else {
    const m=focus||null;
    top2mid(_p1);
    const ref=m||[...marbles].sort((a,b)=>b.s-a.s)[0];
    if(m) marbleWorld(m,_p1);
    if(ref) frameAt(ref.s,FR); else return;
    _p2.copy(_p1).addScaledVector(FR.tan,-10.5).addScaledVector(FR.up,5.4).addScaledVector(FR.side,3.4);
    // lerp per-sumbu: X halus (0.06), Y/Z (0.12) — anti goyang
    camPos.x=lerp(camPos.x,_p2.x,0.06);
    camPos.y=lerp(camPos.y,_p2.y,0.12);
    camPos.z=lerp(camPos.z,_p2.z,0.12);
    _p2.copy(_p1).addScaledVector(FR.tan,9);
    camTgt.x=lerp(camTgt.x,_p2.x,0.06);
    camTgt.y=lerp(camTgt.y,_p2.y,0.12);
    camTgt.z=lerp(camTgt.z,_p2.z,0.12);
  }
  camera.position.copy(camPos); camera.lookAt(camTgt);
}
function setCamMode(md,lock=null){
  camMode=md; camLock=lock;
  document.querySelectorAll('.cambtn').forEach(b=>b.classList.toggle('on',b.dataset.cam===(md==='lock'?'leader':md)));
  document.querySelectorAll('#board .row').forEach(r=>r.classList.toggle('lock',lock&&+r.dataset.i===lock.i));

}

let vicAng=0;
function victoryCam(dt){
  const w=[...marbles].sort((a,b)=>{
    if(a.finished&&b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1; if(b.finished) return 1; return b.s-a.s; })[0];
  if(!w) return;
  marbleWorld(w,_p1); vicAng+=dt*0.55;
  _p2.set(_p1.x+Math.cos(vicAng)*11,_p1.y+4.5,_p1.z+Math.sin(vicAng)*11);
  const k=1-Math.exp(-2.5*dt);
  camPos.lerp(_p2,k); camTgt.lerp(_p1,k);
  camera.position.copy(camPos); camera.lookAt(camTgt);
}

/* ================= MAIN LOOP (fixed substep 1/60) ================= */
const clock=new THREE.Clock();
let acc=0,boardT=0;
const HSTEP=1/60;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,clock.getDelta()), t=clock.elapsedTime;
  if(state==='race'){
    acc+=dt;
    let n=0;
    while(acc>=HSTEP&&n<4){ physStep(HSTEP); acc-=HSTEP; n++; }
    if(n===4) acc=0;
    raceTime+=dt;
    $('timer').textContent='⏱ '+fmtTime(raceTime);
    if(rollGain&&AC) rollGain.gain.value=soundOn?clamp((leader()?leader().vs:0)/22,0,0.5)*0.3:0;
    boardT+=dt;
    if(boardT>0.5){ boardT=0; updateBoard(); detectOvertake(); }
    overtakeT=Math.max(0,overtakeT-dt);
    if(raceTime>RACE_TIMEOUT) endRace();
  } else if(state==='podium'){ victoryCam(dt); }
  for(const sp of spinners){ sp.ang+=sp.spd*dt; sp.grp.rotation.y=sp.ang; }
  for(const b of bumpers){ const s=b.ring.scale.x; if(s>1) b.ring.scale.setScalar(Math.max(1,s-dt*3)); }
  stepParticles(dt);
  for(const m of marbles){
    marbleWorld(m,_p1); m.mesh.position.copy(_p1);
    // blob shadow menempel di permukaan kayu
    frameAt(m.s,FR);
    m.blob.position.copy(FR.pos).addScaledVector(FR.side,m.lat).addScaledVector(FR.up,0.06+m.h*0.15);
    m.blob.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),FR.up);
    const bs=1+clamp(m.h*0.12,0,0.8);
    m.blob.scale.set(bs,bs,1);
    m.blob.material.opacity=clamp(1-m.h*0.08,0.4,1);
  }
  if(state==='race'||state==='podium') updateCamera(); else controls.enabled=false;
  drawLabels();
  renderer.render(scene,camera);
  if(recording) compositeFrame();   // gabung 3D+label+skor khusus video
}
