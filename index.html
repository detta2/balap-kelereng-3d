<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= KONFIG ================= */
const PATTERNS=[
  {key:'cateye', base:'#f4f8ff', swirl:'#e53935'},
  {key:'susu',   base:'#fdfdf5', swirl:'#1e88e5'},
  {key:'marmer', base:'#c62828', swirl:'#ffffff'},
  {key:'laut',   base:'#0d47a1', swirl:'#80d8ff'},
  {key:'zamrud', base:'#1b7a3d', swirl:'#b9f6ca'},
  {key:'amber',  base:'#ef8f00', swirl:'#fff3c4'},
  {key:'ungu',   base:'#5e2b97', swirl:'#e1bee7'},
];
const G=14.0, ROLL_F=0.28, DRAG=0.0035, RAIL_REST=0.55;
const TRACK_W=8, HALF_W=4, MARBLE_R=0.55;
const FINISH_COUNT=3, RACE_TIMEOUT=240;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function fmtTime(s){ const m=Math.floor(s/60), ss=(s%60);
  return String(m).padStart(2,'0')+':'+ss.toFixed(1).padStart(4,'0'); }

/* ================= AUDIO ALAMI ================= */
let AC=null, master=null, mediaDest=null, soundOn=true, rollGain=null, noiseBuf=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.5;
  master.connect(AC.destination);
  mediaDest=AC.createMediaStreamDestination(); master.connect(mediaDest);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=400;
  rollGain=AC.createGain(); rollGain.gain.value=0;
  src.connect(f); f.connect(rollGain); rollGain.connect(master); src.start();
}
function clack(intensity=1,woody=false){
  if(!AC||!soundOn) return;
  const t=AC.currentTime, v=clamp(0.22*intensity,0.03,0.5);
  const n=AC.createBufferSource(); n.buffer=noiseBuf;
  n.playbackRate.value=0.9+Math.random()*0.3;
  const bp=AC.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=woody?900+Math.random()*300:2400+Math.random()*1400; bp.Q.value=7;
  const g=AC.createGain();
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  n.connect(bp); bp.connect(g); g.connect(master); n.start(t); n.stop(t+0.08);
  const o=AC.createOscillator(); o.type='triangle';
  o.frequency.value=woody?420+Math.random()*120:1700+Math.random()*900;
  const g2=AC.createGain();
  g2.gain.setValueAtTime(v*0.7,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.035);
  o.connect(g2); g2.connect(master); o.start(t); o.stop(t+0.06);
}
function whistle(){
  if(!AC||!soundOn) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(2100,t);
  o.frequency.exponentialRampToValueAtTime(3400,t+0.45);
  g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.6);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.65);
}
function cheer(){
  if(!AC||!soundOn) return;
  [523,659,784,1047,1319].forEach((fr,i)=>{
    const t=AC.currentTime+i*0.13,o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle'; o.frequency.value=fr;
    g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.35);
  });
  for(let k=0;k<14;k++){
    const t=AC.currentTime+Math.random()*1.1;
    const n=AC.createBufferSource(); n.buffer=noiseBuf;
    const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=1.2;
    const g=AC.createGain();
    g.gain.setValueAtTime(0.10,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(t); n.stop(t+0.12);
  }
}
function countTick(fin){
  if(!AC||!soundOn) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.value=fin?880:660;
  g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+(fin?0.4:0.12));
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.45);
}

/* ================= TRACK BUILDER ================= */
let seed=(Math.random()*1e9)|0;
function srand(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
const track={pts:[],total:0,pos:[],tan:[],side:[],up:[],curve:null,step:0.5};
const zones={};
let FINISH_S=0;
function buildTrack(){
  track.pts.length=0;
  let x=0,y=92,z=0,ang=0;
  const push=()=>track.pts.push(new THREE.Vector3(x,y,z));
  push();
  function seg(len,dAngDeg,dy,jitter=0){
    const dAng=dAngDeg*Math.PI/180,n=Math.max(2,Math.round(len/8));
    for(let i=0;i<n;i++){
      ang+=dAng/n+(jitter?(srand()-0.5)*jitter/n:0);
      const ds=len/n;
      x+=Math.sin(ang)*ds; z+=Math.cos(ang)*ds; y+=dy/n;
      push();
    }
  }
  const jz=()=>(srand()-0.5)*24;
  seg(50,0,-3); seg(70,55+jz()*0.4,-8); seg(95,-12,-6); seg(60,-52+jz()*0.4,-7);
  seg(95,10,-6); seg(115,0,0); seg(55,-18,-26); seg(85,12,-4);
  seg(95,-14,-6); seg(50,32,-4); seg(50,-32,-4); seg(65,0,-2);
  let acc=0; const tmpS=[];
  for(let i=1;i<track.pts.length;i++){ acc+=track.pts[i].distanceTo(track.pts[i-1]); tmpS.push(acc); }
  for(let i=1;i<track.pts.length;i++){
    const s=tmpS[i-1];
    if(s>375&&s<490) track.pts[i].y+=2.0*Math.sin((s-375)/115*Math.PI*4);
  }
  track.curve=new THREE.CatmullRomCurve3(track.pts);
  track.total=track.curve.getLength();
  const N=Math.ceil(track.total/track.step)+1;
  track.pos=new Array(N); track.tan=new Array(N); track.side=new Array(N); track.up=new Array(N);
  const up=new THREE.Vector3(0,1,0),T=new THREE.Vector3(),S=new THREE.Vector3(),U=new THREE.Vector3();
  for(let i=0;i<N;i++){
    const u=clamp(i*track.step/track.total,0,1);
    const p=track.curve.getPointAt(u);
    track.curve.getTangentAt(u,T);
    S.crossVectors(up,T).normalize(); if(S.lengthSq()<0.5) S.set(1,0,0);
    U.crossVectors(T,S).normalize();
    track.pos[i]=p.clone(); track.tan[i]=T.clone(); track.side[i]=S.clone(); track.up[i]=U.clone();
  }
  FINISH_S=track.total-22;
  zones.pegs=[128,215]; zones.spinners=[278,368]; zones.boost=[528,608]; zones.bump=[618,708];
}
function frameAt(s,out){
  const i=clamp(Math.round(s/track.step),0,track.pos.length-1);
  out.pos.copy(track.pos[i]); out.tan.copy(track.tan[i]);
  out.side.copy(track.side[i]); out.up.copy(track.up[i]);
  return out;
}

/* ================= SCENE TAMAN CERAH ================= */
const canvas=$('c3d');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.shadowMap.enabled=false;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xd8ecfa,90,420);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.1,1500);
camera.position.set(0,100,40);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.maxDistance=220; controls.minDistance=4; controls.enabled=false;
scene.add(new THREE.HemisphereLight(0xcfe8ff,0x8a7a5a,1.0));
const sun=new THREE.DirectionalLight(0xfff1d6,1.6);
sun.position.set(60,90,30); scene.add(sun);
// kubah langit gradasi
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#3f9be0'); g.addColorStop(0.55,'#8fcdf5');
  g.addColorStop(0.8,'#dff0fd'); g.addColorStop(1,'#fff6e3');
  x.fillStyle=g; x.fillRect(0,0,4,256);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const sky=new THREE.Mesh(new THREE.SphereGeometry(900,24,16),
    new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false}));
  scene.add(sky);
  // matahari
  const sc=document.createElement('canvas'); sc.width=sc.height=128;
  const sx=sc.getContext('2d');
  const sg=sx.createRadialGradient(64,64,6,64,64,62);
  sg.addColorStop(0,'rgba(255,250,220,1)'); sg.addColorStop(0.35,'rgba(255,240,190,.85)'); sg.addColorStop(1,'rgba(255,240,190,0)');
  sx.fillStyle=sg; sx.fillRect(0,0,128,128);
  const sunSp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sc),transparent:true,fog:false,depthWrite:false}));
  sunSp.position.set(320,420,-650); sunSp.scale.set(150,150,1); scene.add(sunSp);
  // awan lembut
  const cc=document.createElement('canvas'); cc.width=cc.height=128;
  const cx=cc.getContext('2d');
  const cg=cx.createRadialGradient(64,64,8,64,64,62);
  cg.addColorStop(0,'rgba(255,255,255,.95)'); cg.addColorStop(1,'rgba(255,255,255,0)');
  cx.fillStyle=cg; cx.fillRect(0,0,128,128);
  const ct=new THREE.CanvasTexture(cc);
  window._clouds=[];
  for(let i=0;i<16;i++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:ct,transparent:true,opacity:0.9,depthWrite:false}));
    sp.position.set((Math.random()-0.5)*1100,170+Math.random()*110,(Math.random()-0.5)*1100);
    const s=70+Math.random()*110; sp.scale.set(s,s*0.42,1);
    sp.userData.vx=0.6+Math.random()*0.9;
    scene.add(sp); window._clouds.push(sp);
  }
}
// rumput berpola: dua hijau + bercak pasir
function grassTexture(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const x=c.getContext('2d');
  x.fillStyle='#79c25e'; x.fillRect(0,0,512,512);
  for(let i=0;i<900;i++){
    x.fillStyle=Math.random()<0.5?'rgba(90,170,70,.5)':'rgba(140,210,110,.45)';
    const r=4+Math.random()*16;
    x.beginPath(); x.arc(Math.random()*512,Math.random()*512,r,0,7); x.fill();
  }
  for(let i=0;i<26;i++){ // bercak pasir/tanah
    x.fillStyle='rgba(205,175,120,.5)';
    x.beginPath();
    x.ellipse(Math.random()*512,Math.random()*512,14+Math.random()*36,10+Math.random()*24,Math.random()*3,0,7);
    x.fill();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(24,24); t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
{
  const g=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),
    new THREE.MeshStandardMaterial({map:grassTexture(),roughness:1}));
  g.rotation.x=-Math.PI/2; g.position.y=-14; scene.add(g);
}
// kayu berdetail: serat + sambungan papan + baut
function woodTexture(){
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const x=c.getContext('2d');
  x.fillStyle='#d4a373'; x.fillRect(0,0,256,256);
  for(let i=0;i<40;i++){
    x.strokeStyle='rgba(150,95,40,'+(0.05+Math.random()*0.10)+')';
    x.lineWidth=1+Math.random()*2.5; x.beginPath();
    const y0=Math.random()*256;
    for(let px=0;px<=256;px+=16) x.lineTo(px,y0+Math.sin(px*0.03+i)*7);
    x.stroke();
  }
  // sambungan antar papan (tiap 64px)
  for(let y=0;y<=256;y+=64){
    x.strokeStyle='rgba(110,65,25,.55)'; x.lineWidth=3;
    x.beginPath(); x.moveTo(0,y); x.lineTo(256,y); x.stroke();
    x.strokeStyle='rgba(255,235,200,.35)'; x.lineWidth=1;
    x.beginPath(); x.moveTo(0,y+3); x.lineTo(256,y+3); x.stroke();
  }
  // baut/paku kecil di pinggir papan
  for(let y=32;y<256;y+=64) for(const bx of [14,242]){
    x.fillStyle='#6b4a22'; x.beginPath(); x.arc(bx,y,5,0,7); x.fill();
    x.fillStyle='#a8824f'; x.beginPath(); x.arc(bx-1.5,y-1.5,2,0,7); x.fill();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
let trackGroup=null;
function checkerTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d'),n=8,s=128/n;
  for(let r=0;r<n;r++)for(let q=0;q<n;q++){ x.fillStyle=(r+q)%2?'#161616':'#f7f7f7'; x.fillRect(q*s,r*s,s,s); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
const F0={pos:new THREE.Vector3(),tan:new THREE.Vector3(),side:new THREE.Vector3(),up:new THREE.Vector3()};
function buildTrackMesh(){
  if(trackGroup){ scene.remove(trackGroup); trackGroup.traverse(o=>{o.geometry&&o.geometry.dispose();}); }
  trackGroup=new THREE.Group(); scene.add(trackGroup);
  const N=track.pos.length,W2=HALF_W;
  const vtx=new Float32Array(N*2*3),nrm=new Float32Array(N*2*3),uv=new Float32Array(N*2*2);
  const curv=new Float32Array(N);
  for(let i=0;i<N;i++){
    frameAt(i*track.step,F0);
    vtx.set([F0.pos.x-F0.side.x*W2,F0.pos.y-F0.side.y*W2,F0.pos.z-F0.side.z*W2,
             F0.pos.x+F0.side.x*W2,F0.pos.y+F0.side.y*W2,F0.pos.z+F0.side.z*W2],i*6);
    nrm.set([F0.up.x,F0.up.y,F0.up.z,F0.up.x,F0.up.y,F0.up.z],i*6);
    uv.set([0,i*track.step/6,1,i*track.step/6],i*4);
    if(i>0&&i<N-1){ const a=track.tan[i-1],b=track.tan[i+1];
      curv[i]=Math.acos(clamp(a.dot(b),-1,1))/(2*track.step); }
  }
  const idx=[];
  for(let i=0;i<N-1;i++){ const a=i*2; idx.push(a,a+1,a+2,a+1,a+3,a+2); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(vtx,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setIndex(idx);
  const wt=woodTexture(); wt.repeat.set(1,140);
  trackGroup.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:wt,roughness:0.72,metalness:0.02})));
  // dinding pembatas kayu bertekstur (lebih tinggi di tikungan)
  const wallTex=woodTexture();
  [-1,1].forEach(sg=>{
    const wv=[],widx=[],capPts=[];
    for(let i=0;i<N;i++){
      frameAt(i*track.step,F0);
      const hgt=1.0+clamp(curv[i]*22,0,1.2);
      const bx=F0.pos.x+F0.side.x*W2*sg,by=F0.pos.y+F0.side.y*W2*sg,bz=F0.pos.z+F0.side.z*W2*sg;
      wv.push(bx,by,bz,bx+F0.up.x*hgt,by+F0.up.y*hgt,bz+F0.up.z*hgt);
      if(i<N-1){ const a=i*2; widx.push(a,a+2,a+1,a+1,a+2,a+3); }
      if(i%3===0) capPts.push(new THREE.Vector3(bx+F0.up.x*(hgt+0.09),by+F0.up.y*(hgt+0.09),bz+F0.up.z*(hgt+0.09)));
    }
    const wg=new THREE.BufferGeometry();
    wg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(wv),3));
    wg.setIndex(widx); wg.computeVertexNormals();
    const wm=new THREE.MeshStandardMaterial({map:wallTex,roughness:0.78,side:THREE.DoubleSide});
    trackGroup.add(new THREE.Mesh(wg,wm));
    trackGroup.add(new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(capPts),Math.ceil(N/3),0.17,8),
      new THREE.MeshStandardMaterial({color:0x8a4d16,roughness:0.7})));
  });
  buildSupports();
  buildDecor();
  buildGates();
}
// tiang penyangga kayu di bawah lintasan
function buildSupports(){
  const postG=new THREE.BoxGeometry(0.7,1,0.7);
  const beamG=new THREE.BoxGeometry(TRACK_W+1.6,0.55,0.7);
  const mat=new THREE.MeshStandardMaterial({color:0x7a4d20,roughness:0.85});
  const posts=[],beams=[];
  for(let s=10;s<track.total-10;s+=18){
    frameAt(s,F0);
    const topY=F0.pos.y-0.4, h=topY-(-14);
    if(h<2) continue;
    [-2.6,2.6].forEach(lat=>{
      posts.push({x:F0.pos.x+F0.side.x*lat,y:-14+h/2,z:F0.pos.z+F0.side.z*lat,sy:h});
    });
    beams.push({p:F0.pos.clone(),side:F0.side.clone(),up:F0.up.clone(),y:topY+0.1});
  }
  const pi=new THREE.InstancedMesh(postG,mat,posts.length);
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),S=new THREE.Vector3(),P=new THREE.Vector3();
  posts.forEach((o,i)=>{ P.set(o.x,o.y,o.z); S.set(1,o.sy,1); Q.identity();
    M.compose(P,Q,S); pi.setMatrixAt(i,M); });
  trackGroup.add(pi);
  const bi=new THREE.InstancedMesh(beamG,mat,beams.length);
  beams.forEach((o,i)=>{ P.copy(o.p).addScaledVector(o.up,o.y-o.p.y); S.set(1,1,1);
    const m4=new THREE.Matrix4().makeBasis(o.side.clone(),o.up.clone(),new THREE.Vector3().crossVectors(o.side,o.up));
    Q.setFromRotationMatrix(m4); M.compose(P,Q,S); bi.setMatrixAt(i,M); });
  trackGroup.add(bi);
}
// dekorasi taman: pinus, batu, pagar
let decorGroup=null;
function buildDecor(){
  if(decorGroup){ trackGroup.remove(decorGroup); }
  decorGroup=new THREE.Group(); trackGroup.add(decorGroup);
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),S=new THREE.Vector3(1,1,1),P=new THREE.Vector3();
  const F={pos:new THREE.Vector3(),tan:new THREE.Vector3(),side:new THREE.Vector3(),up:new THREE.Vector3()};
  // pohon pinus low-poly
  const trunkG=new THREE.CylinderGeometry(0.35,0.5,2.6,7);
  const leafG=new THREE.ConeGeometry(2.4,5.5,8);
  const trunkM=new THREE.MeshStandardMaterial({color:0x6b4a26,roughness:0.9});
  const leafM=new THREE.MeshStandardMaterial({color:0x2f8f4e,roughness:0.85});
  const NT=64;
  const trunks=new THREE.InstancedMesh(trunkG,trunkM,NT);
  const leafs=new THREE.InstancedMesh(leafG,leafM,NT);
  for(let i=0;i<NT;i++){
    const s=10+Math.random()*(track.total-20);
    const side=Math.random()<0.5?-1:1, off=13+Math.random()*30;
    frameAt(s,F);
    P.set(F.pos.x+F.side.x*off*side+(Math.random()-0.5)*8,-14+1.3,F.pos.z+F.side.z*off*side+(Math.random()-0.5)*8);
    const sc=0.8+Math.random()*0.9; S.set(sc,sc,sc); Q.identity();
    M.compose(P,Q,S); trunks.setMatrixAt(i,M);
    P.y=-14+2.6*sc+2.2*sc; M.compose(P,Q,S); leafs.setMatrixAt(i,M);
  }
  decorGroup.add(trunks); decorGroup.add(leafs);
  // batu taman
  const rockG=new THREE.DodecahedronGeometry(0.9,0);
  const rockM=new THREE.MeshStandardMaterial({color:0x9a9a98,roughness:0.95});
  const NR=36, rocks=new THREE.InstancedMesh(rockG,rockM,NR);
  for(let i=0;i<NR;i++){
    const s=10+Math.random()*(track.total-20);
    const side=Math.random()<0.5?-1:1, off=10+Math.random()*22;
    frameAt(s,F);
    P.set(F.pos.x+F.side.x*off*side,-14+0.4,F.pos.z+F.side.z*off*side);
    const sc=0.5+Math.random()*1.1; S.set(sc,sc*0.7,sc);
    Q.setFromEuler(new THREE.Euler(Math.random()*3,Math.random()*3,Math.random()*3));
    M.compose(P,Q,S); rocks.setMatrixAt(i,M);
  }
  decorGroup.add(rocks);
  // pagar kayu taman di kedua sisi
  const pickG=new THREE.BoxGeometry(0.28,1.3,0.12);
  const pickM=new THREE.MeshStandardMaterial({color:0xa06a30,roughness:0.85});
  const step=4, count=Math.floor(track.total/step)*2;
  const picks=new THREE.InstancedMesh(pickG,pickM,count);
  let pi2=0;
  for(let s=6;s<track.total-6&&pi2<count;s+=step){
    frameAt(s,F);
    [-1,1].forEach(sg=>{
      if(pi2>=count) return;
      const off=9.5;
      P.set(F.pos.x+F.side.x*off*sg,-14+0.65,F.pos.z+F.side.z*off*sg);
      const yaw=Math.atan2(F.side.x*sg,F.side.z*sg);
      Q.setFromEuler(new THREE.Euler(0,yaw,0)); S.set(1,1,1);
      M.compose(P,Q,S); picks.setMatrixAt(pi2++,M);
    });
  }
  picks.count=pi2; decorGroup.add(picks);
}
// gerbang start (lengkung kayu) + pintu air animasi + garis finish
let startGate=null, finishFlags=[];
function buildGates(){
  finishFlags=[];
  const chk=checkerTex();
  const woodM=new THREE.MeshStandardMaterial({color:0x7a4d20,roughness:0.7});
  function archAt(s,label){
    frameAt(s,F0);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(HALF_W*2,3),
      new THREE.MeshBasicMaterial({map:chk.clone()}));
    m.material.map.repeat.set(6,1); m.material.map.needsUpdate=true;
    m.position.copy(F0.pos).addScaledVector(F0.up,0.07);
    m.quaternion.setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(),F0.tan.clone().negate(),F0.up));
    m.rotateX(-Math.PI/2);
    trackGroup.add(m);
    const poleG=new THREE.CylinderGeometry(0.26,0.32,7.6,10);
    [-1,1].forEach(sg=>{
      const p=new THREE.Mesh(poleG,woodM);
      p.position.copy(F0.pos).addScaledVector(F0.side,sg*(HALF_W+0.7)).addScaledVector(F0.up,3.8);
      trackGroup.add(p);
    });
    const bw=HALF_W*2+2.6;
    const beam=new THREE.Mesh(new THREE.BoxGeometry(bw,0.55,0.55),woodM);
    beam.position.copy(F0.pos).addScaledVector(F0.up,7.4);
    beam.quaternion.setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(),F0.tan.clone().negate(),F0.up));
    beam.rotateY(Math.PI/2);
    trackGroup.add(beam);
    const cv=document.createElement('canvas'); cv.width=512; cv.height=96;
    const cx2=cv.getContext('2d');
    cx2.fillStyle='#fdf6e3'; cx2.fillRect(0,0,512,96);
    cx2.fillStyle='#7a4d20'; cx2.font='900 58px Trebuchet MS';
    cx2.textAlign='center'; cx2.textBaseline='middle'; cx2.fillText(label,256,52);
    const tm=new THREE.Mesh(new THREE.PlaneGeometry(bw*0.9,1.5),
      new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),side:THREE.DoubleSide}));
    tm.position.copy(F0.pos).addScaledVector(F0.up,6.2);
    tm.quaternion.setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(),F0.tan.clone().negate(),F0.up));
    trackGroup.add(tm);
    return F0;
  }
  archAt(12,'START');
  const fF=archAt(FINISH_S,'GARIS FINISH');
  // bendera kotak-kotak berkibar di gapura finish
  [-1,1].forEach(sg=>{
    const fg=new THREE.PlaneGeometry(1.6,1.0,6,1);
    const fl=new THREE.Mesh(fg,new THREE.MeshBasicMaterial({map:chk.clone(),side:THREE.DoubleSide}));
    fl.material.map.repeat.set(4,2); fl.material.map.needsUpdate=true;
    const top=new THREE.Vector3().copy(fF.pos).addScaledVector(fF.side,sg*(HALF_W+0.7)).addScaledVector(fF.up,7.9);
    fl.position.copy(top).addScaledVector(fF.side,sg*0.9);
    fl.userData.base=fl.position.clone(); fl.userData.ph=Math.random()*6;
    trackGroup.add(fl); finishFlags.push(fl);
  });
  // PINTU AIR START (sluice gate) di s=5 — turun saat GO
  const fr=frameAt(5,F0);
  const grp=new THREE.Group();
  const m4=new THREE.Matrix4().makeBasis(fr.side.clone(),fr.up.clone(),fr.tan.clone().negate());
  grp.quaternion.setFromRotationMatrix(m4);
  grp.position.copy(fr.pos);
  const frameM=new THREE.MeshStandardMaterial({color:0x5a3a16,roughness:0.75});
  [-1,1].forEach(sg=>{
    const post=new THREE.Mesh(new THREE.BoxGeometry(0.45,3.4,0.45),frameM);
    post.position.set(sg*(HALF_W+0.4),1.7,0); grp.add(post);
  });
  const plank=new THREE.Mesh(new THREE.BoxGeometry(HALF_W*2+0.8,1.5,0.28),
    new THREE.MeshStandardMaterial({map:woodTexture(),roughness:0.7}));
  plank.position.set(0,0.75,0); grp.add(plank);
  const stripeC=document.createElement('canvas'); stripeC.width=128; stripeC.height=16;
  const scx=stripeC.getContext('2d');
  for(let i=0;i<8;i++){ scx.fillStyle=i%2?'#c0392b':'#f7f7f7'; scx.fillRect(i*16,0,16,16); }
  const stripe=new THREE.Mesh(new THREE.PlaneGeometry(HALF_W*2+0.8,0.3),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(stripeC)}));
  stripe.position.set(0,1.35,0.16); grp.add(stripe);
  trackGroup.add(grp);
  startGate={grp,plank,openT:1};   // openT 0=tertutup 1=terbuka
}

/* ================= RINTANGAN ================= */
const pegs=[],spinners=[],boosters=[],bumpers=[];
let obsGroup=null;
function clearObstacles(){ pegs.length=0;spinners.length=0;boosters.length=0;bumpers.length=0;
  if(obsGroup){ scene.remove(obsGroup); obsGroup.traverse(o=>{o.geometry&&o.geometry.dispose();}); }
  obsGroup=new THREE.Group(); scene.add(obsGroup); }
const F2={pos:new THREE.Vector3(),tan:new THREE.Vector3(),side:new THREE.Vector3(),up:new THREE.Vector3()};
function placeOnTrack(obj,s,lat,h=0){ frameAt(s,F2);
  obj.position.copy(F2.pos).addScaledVector(F2.side,lat).addScaledVector(F2.up,h); return F2; }
function stripeTex(c1,c2){
  const cv=document.createElement('canvas'); cv.width=128; cv.height=32;
  const x=cv.getContext('2d');
  for(let i=0;i<8;i++){ x.fillStyle=i%2?c1:c2; x.fillRect(i*16,0,16,32); }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function buildObstacles(){
  clearObstacles();
  // paku kuningan mengkilap zig-zag
  const brass=new THREE.MeshStandardMaterial({color:0xd8b13a,roughness:0.22,metalness:1.0});
  const pegGeo=new THREE.CylinderGeometry(0.3,0.38,1.7,14);
  const capGeo=new THREE.SphereGeometry(0.36,12,10);
  for(let s=zones.pegs[0];s<zones.pegs[1];s+=9){
    const row=Math.round((s-zones.pegs[0])/9);
    const lat=(row%2?-2.1:2.1)+(srand()-0.5)*0.6;
    const grp=new THREE.Group();
    grp.add(new THREE.Mesh(pegGeo,brass));
    const cap=new THREE.Mesh(capGeo,brass); cap.position.y=0.85; grp.add(cap);
    placeOnTrack(grp,s,lat,0.85); obsGroup.add(grp);
    pegs.push({s,lat,r:0.4});
  }
  // kincir karnaval: merah-putih & biru-kuning
  const hubM=new THREE.MeshStandardMaterial({color:0x6e4a1f,roughness:0.6,metalness:0.2});
  const texRW=stripeTex('#c0392b','#f7f7f7'), texBY=stripeTex('#2471a3','#f9d423');
  [0.32,0.55,0.78].forEach((f,i)=>{
    const s=lerp(zones.spinners[0],zones.spinners[1],f);
    const grp=new THREE.Group();
    grp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,1.3,12),hubM));
    const arm=new THREE.Mesh(new THREE.BoxGeometry(6.4,0.62,1.0),
      new THREE.MeshStandardMaterial({map:i%2?texBY:texRW,roughness:0.6}));
    grp.add(arm);
    [-3.2,3.2].forEach(x=>{
      const tip=new THREE.Mesh(new THREE.SphereGeometry(0.55,12,10),
        new THREE.MeshStandardMaterial({color:i%2?0xf9d423:0xc0392b,roughness:0.5}));
      tip.position.x=x; grp.add(tip);
    });
    const fr=placeOnTrack(grp,s,0,1.2);
    grp.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(fr.side.clone(),fr.up.clone(),fr.tan.clone().negate()));
    obsGroup.add(grp);
    spinners.push({s,lat:0,half:3.2,ang:srand()*6.28,spd:(1.6+srand()*0.9)*(i%2?-1:1),grp});
  });
  // booster pad kayu + panah hijau
  const padGeo=new THREE.PlaneGeometry(5.6,9);
  for(let i=0;i<3;i++){
    const s=zones.boost[0]+14+i*24;
    const cv=document.createElement('canvas'); cv.width=128; cv.height=128;
    const c2=cv.getContext('2d');
    c2.fillStyle='#8a5a28'; c2.fillRect(0,0,128,128);
    c2.strokeStyle='#5a3a16'; c2.lineWidth=8; c2.strokeRect(4,4,120,120);
    c2.fillStyle='#2ecc71';
    for(let k=0;k<3;k++){ const y=18+k*36;
      c2.beginPath(); c2.moveTo(34,y); c2.lineTo(94,y+18); c2.lineTo(34,y+36); c2.closePath(); c2.fill(); }
    const m=new THREE.Mesh(padGeo,new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv)}));
    const fr=placeOnTrack(m,s,0,0.09);
    m.quaternion.setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(),fr.tan.clone().negate(),fr.up));
    m.rotateX(-Math.PI/2);
    obsGroup.add(m);
    boosters.push({s0:s-4.5,s1:s+4.5,lat:2.8});
  }
  // bumper karet warna-warni + cincin
  const bGeo=new THREE.CylinderGeometry(0.85,1.0,1.5,18);
  const cols=[0xe74c3c,0x2980b9,0xf39c12,0x27ae60,0x8e44ad,0xe67e22];
  for(let i=0;i<6;i++){
    const s=zones.bump[0]+12+i*14, lat=(i%2?-1.9:1.9);
    const m=new THREE.Mesh(bGeo,new THREE.MeshStandardMaterial({color:cols[i%cols.length],roughness:0.55}));
    placeOnTrack(m,s,lat,0.75); obsGroup.add(m);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.98,0.12,8,24),
      new THREE.MeshBasicMaterial({color:0xffffff}));
    ring.position.copy(m.position); ring.rotation.x=Math.PI/2; obsGroup.add(ring);
    bumpers.push({s,lat,r:1.0,ring,mesh:m});
  }
}

/* ================= KELERENG KACA ================= */
function glassTexture(pat){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d');
  x.fillStyle=pat.base; x.fillRect(0,0,256,256);
  const R=(a,b)=>a+Math.random()*(b-a);
  if(pat.key==='cateye'){
    for(let k=0;k<6;k++){ x.strokeStyle='rgba(255,255,255,.9)'; x.lineWidth=R(6,14); x.beginPath();
      const y0=20+k*40; for(let px=0;px<=256;px+=8) x.lineTo(px,y0+Math.sin(px*0.05+k*2)*18); x.stroke(); }
    const g=x.createRadialGradient(128,128,6,128,128,60);
    g.addColorStop(0,pat.swirl); g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g; x.fillRect(0,0,256,256);
  } else if(pat.key==='susu'){
    for(let k=0;k<7;k++){ x.strokeStyle=pat.swirl; x.globalAlpha=0.75; x.lineWidth=R(8,18); x.beginPath();
      const y0=14+k*34; for(let px=0;px<=256;px+=8) x.lineTo(px,y0+Math.sin(px*0.04+k)*24); x.stroke(); }
    x.globalAlpha=1;
  } else {
    for(let k=0;k<9;k++){ x.strokeStyle='rgba(255,255,255,.8)'; x.lineWidth=R(3,9); x.beginPath();
      let px=Math.random()*256,py=Math.random()*256; x.moveTo(px,py);
      for(let s2=0;s2<6;s2++){ px+=R(-70,70); py+=R(-70,70); x.lineTo(px,py); } x.stroke(); }
    for(let k=0;k<4;k++){ x.strokeStyle=pat.swirl; x.globalAlpha=0.5; x.lineWidth=R(10,20); x.beginPath();
      const y0=Math.random()*256; for(let px=0;px<=256;px+=8) x.lineTo(px,y0+Math.sin(px*0.06+k)*20); x.stroke(); }
    x.globalAlpha=1;
  }
  const hg=x.createLinearGradient(0,0,256,256);
  hg.addColorStop(0,'rgba(255,255,255,.35)'); hg.addColorStop(0.4,'rgba(255,255,255,0)');
  x.fillStyle=hg; x.fillRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function blobTexture(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,6,64,64,62);
  g.addColorStop(0,'rgba(40,20,5,.42)'); g.addColorStop(0.7,'rgba(40,20,5,.18)'); g.addColorStop(1,'rgba(40,20,5,0)');

const marbles=[];
let marbleGroup=null, blobTex=null;
function clearMarbles(){ marbles.length=0;
  if(marbleGroup){ scene.remove(marbleGroup); marbleGroup.traverse(o=>{o.geometry&&o.geometry.dispose();}); }
  marbleGroup=new THREE.Group(); scene.add(marbleGroup); }
function buildMarbles(names){
  clearMarbles();
  if(!blobTex) blobTex=blobTexture();
  const geo=new THREE.SphereGeometry(MARBLE_R,36,24);
  const blobGeo=new THREE.PlaneGeometry(1.7,1.7);
  names.forEach((nm,i)=>{
    const pat=PATTERNS[i%PATTERNS.length];

    marbleGroup.add(blob);
    marbles.push({ i,name:nm,pat,mesh,blob,
      s:2,lat:(Math.random()*2-1)*3,h:0,vs:0,vlat:0,vh:0,

/* ================= FISIKA ================= */
const FR={pos:new THREE.Vector3(),tan:new THREE.Vector3(),side:new THREE.Vector3(),up:new THREE.Vector3()};
const _v=new THREE.Vector3(),_p=new THREE.Vector3(),_q=new THREE.Quaternion();
function marbleWorld(m,out){ frameAt(m.s,FR);
  out.copy(FR.pos).addScaledVector(FR.side,m.lat).addScaledVector(FR.up,MARBLE_R+m.h); return out; }
function physStep(dt){
  const n=marbles.length;
  for(const m of marbles){
    if(m.finished) m.vs=Math.max(0,m.vs-8*dt);
    frameAt(m.s,FR);
    const slope=FR.tan.y;
    let a=-G*slope-ROLL_F*Math.sign(m.vs)-DRAG*m.vs*Math.abs(m.vs);
    if(m.finished) a-=4;
    m.vs=Math.max(0,m.vs+a*dt);
    m.s+=m.vs*dt;
    m.vlat*=Math.max(0,1-2.2*dt);
    m.lat+=m.vlat*dt;
    const lim=HALF_W-MARBLE_R-0.15;
    if(m.lat>lim){ m.lat=lim; if(m.vlat>0){ m.vlat=-m.vlat*RAIL_REST; clack(0.7,true); spark(marbleWorld(m,_v),5,0xd8b13a,4,3);} }
    if(m.lat<-lim){ m.lat=-lim; if(m.vlat<0){ m.vlat=-m.vlat*RAIL_REST; clack(0.7,true); spark(marbleWorld(m,_v),5,0xd8b13a,4,3);} }
    if(m.h>0||m.vh!==0){
      m.vh-=G*1.6*dt; m.h+=m.vh*dt;
      if(m.h<=0){ m.h=0; if(m.vh<-1.5){ clack(0.5,true); spark(marbleWorld(m,_v),4,0xffffff,3,2);} m.vh=Math.abs(m.vh)*0.4; if(m.vh<0.8)m.vh=0; }
    }
    hitObstacles(m,dt);
    if(!m.finished&&m.s>=FINISH_S){
      m.finished=true; m.finishTime=raceTime;
      finishers.push(m); confetti(marbleWorld(m,_v)); cheer();
      if(finishers.length>=FINISH_COUNT) endRace();
    }
    if(!m.finished){
      if(m.s-m.lastS>0.5){ m.lastS=m.s; m.stuckT=0; }
      else{ m.stuckT+=dt;
        if(m.stuckT>2.5){
          m.s=Math.max(2,m.lastS-2); m.lat*=0.3; m.h=0; m.vh=0; m.vlat=0; m.vs=6;
          m.stuckT=0; spark(marbleWorld(m,_v),12,0xffd54f,6,6); clack(1.2);
        } }
      if(Math.abs(m.lat)>HALF_W+3||m.h<-4||!isFinite(m.s+m.lat)){
        m.s=Math.max(2,m.lastS); m.lat=0; m.h=2; m.vh=0; m.vlat=0; m.vs=7; m.stuckT=0;
      }
    }
    m.boostCd=Math.max(0,m.boostCd-dt);
    if(m.vs>0.01){ _q.setFromAxisAngle(FR.side,-(m.vs/MARBLE_R)*dt); m.mesh.quaternion.premultiply(_q); }
  }
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    const a=marbles[i],b=marbles[j];
    if(Math.abs(a.s-b.s)>2.5) continue;
    const dx=b.s-a.s,dy=b.lat-a.lat,d2=dx*dx+dy*dy,rr=MARBLE_R*2;
    if(d2<rr*rr&&d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(rr-d)/2;
      a.s-=nx*ov; a.lat-=ny*ov; b.s+=nx*ov; b.lat+=ny*ov;
      const avn=a.vs*nx+a.vlat*ny,bvn=b.vs*nx+b.vlat*ny,imp=(avn-bvn)*0.9;
      if(imp>0){ a.vs-=nx*imp; a.vlat-=ny*imp; b.vs+=nx*imp; b.vlat+=ny*imp;
        if(imp>2){ clack(imp*0.3); spark(marbleWorld(a,_v),5,0xffffff,4,3); } }
    }
  }
}
function hitObstacles(m,dt){
  for(const p of pegs){
    const ds=m.s-p.s; if(ds>2||ds<-2) continue;
    const dx=ds,dy=m.lat-p.lat,d2=dx*dx+dy*dy,rr=p.r+MARBLE_R;
    if(d2<rr*rr&&d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      m.s=p.s+nx*rr; m.lat=p.lat+ny*rr;
      const vn=m.vs*nx+m.vlat*ny;
      if(vn<0){ m.vs-=1.55*vn*nx; m.vlat-=1.55*vn*ny; m.vh=Math.max(m.vh,1.2);
        clack(-vn*0.5); spark(marbleWorld(m,_v),7,0xffd54f,5,4); }
    }
  }
  for(const b of bumpers){
    const ds=m.s-b.s; if(ds>2.4||ds<-2.4) continue;
    const dx=ds,dy=m.lat-b.lat,d2=dx*dx+dy*dy,rr=b.r+MARBLE_R;
    if(d2<rr*rr&&d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      m.s=b.s+nx*rr; m.lat=b.lat+ny*rr;
      const vn=m.vs*nx+m.vlat*ny;
      if(vn<0){ m.vs-=1.9*vn*nx; m.vlat-=1.9*vn*ny; m.vs+=2.0; m.vh=Math.max(m.vh,2.2);
        b.ring.scale.setScalar(1.4); b.mesh.scale.set(1.15,0.85,1.15);
        clack(-vn*0.8,true); spark(marbleWorld(m,_v),12,0xffffff,7,5); }
    }
  }
  for(const sp of spinners){
    const ds=m.s-sp.s; if(ds>4.5||ds<-4.5) continue;
    const c=Math.cos(sp.ang),sn=Math.sin(sp.ang),dl=m.lat-sp.lat;
    const lx=ds*c+dl*sn,ly=-ds*sn+dl*c,hw=0.75;
    if(Math.abs(lx)<sp.half+MARBLE_R&&Math.abs(ly)<hw+MARBLE_R){
      const sgn=ly>=0?1:-1,push=(hw+MARBLE_R-Math.abs(ly));
      m.s+=-sn*push*sgn; m.lat+=c*push*sgn;
      const tv=sp.spd*lx;
      m.vs=Math.max(0,m.vs-sn*tv*0.9); m.vlat+=c*tv*0.9; m.vh=Math.max(m.vh,1.0);
      clack(1.2,true); spark(marbleWorld(m,_v),6,0xffffff,5,4);
    }
  }
  if(m.boostCd<=0) for(const bo of boosters){
    if(m.s>bo.s0&&m.s<bo.s1&&Math.abs(m.lat)<bo.lat){
      m.vs=Math.min(26,m.vs+22*dt+3.2); m.boostCd=0.4;
      spark(marbleWorld(m,_v),10,0x2ecc71,6,5); clack(0.8);
    }
  }
}

/* ================= PARTIKEL ================= */
const PMAX=380;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(PMAX*3),pCol=new Float32Array(PMAX*3);
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const points=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.5,vertexColors:true,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
points.frustumCulled=false; scene.add(points);
const parts=[]; for(let i=0;i<PMAX;i++) parts.push({life:0,x:0,y:0,z:0,vx:0,vy:0,vz:0,r:1,g:1,b:1});
let pIdx=0;
function spark(p,n,color,spd=6,up=4){
  const c=new THREE.Color(color);
  for(let k=0;k<n;k++){ const q=parts[pIdx]; pIdx=(pIdx+1)%PMAX;
    q.life=0.5+Math.random()*0.5; q.x=p.x; q.y=p.y; q.z=p.z;
    const a=Math.random()*6.28,e=Math.random()*spd;
    q.vx=Math.cos(a)*e; q.vz=Math.sin(a)*e; q.vy=Math.random()*up;
    q.r=c.r; q.g=c.g; q.b=c.b; }
}
function confetti(p){ [0xffd54f,0xef5350,0x29b6f6,0x66bb6a,0xffffff].forEach(cc=>{ for(let k=0;k<12;k++) spark(p,1,cc,9,10); }); }
function stepParticles(dt){
  for(let i=0;i<PMAX;i++){ const q=parts[i];
    if(q.life>0){ q.life-=dt; q.vy-=12*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt; }
    const f=clamp(q.life*2,0,1);
    pPos[i*3]=q.x; pPos[i*3+1]=q.y; pPos[i*3+2]=q.z;
    pCol[i*3]=q.r*f; pCol[i*3+1]=q.g*f; pCol[i*3+2]=q.b*f;
  }
  pGeo.attributes.position.needsUpdate=true; pGeo.attributes.color.needsUpdate=true;
}

let camMode='leader';
const camPos=new THREE.Vector3(0,100,40),camTgt=new THREE.Vector3(0,90,0);
const _p1=new THREE.Vector3(),_p2=new THREE.Vector3();
let idleAng=0;
function leader(){ return [...marbles].sort((a,b)=>b.s-a.s)[0]; }
function top2mid(out){
  const r=[...marbles].sort((a,b)=>b.s-a.s);
  if(r.length>=2){ marbleWorld(r[0],_p1); marbleWorld(r[1],_p2); out.copy(_p1).add(_p2).multiplyScalar(0.5); }
  else if(r.length) marbleWorld(r[0],out);
  return out;
}
// orbit lembut saat idle (menunggu start)
function idleOrbit(dt){
  idleAng+=dt*0.18;
  frameAt(8,FR); marbleWorld(marbles[0]||{s:8,lat:0,h:0},_p1);
  _p2.set(_p1.x+Math.cos(idleAng)*22,_p1.y+9,_p1.z+Math.sin(idleAng)*22);
  const k=1-Math.exp(-1.5*dt);
  camPos.lerp(_p2,k); camTgt.lerp(_p1,k);
  camera.position.copy(camPos); camera.lookAt(camTgt);
}
function updateCamera(){
  if(camMode==='orbit'){ controls.enabled=true; controls.update(); return; }
  controls.enabled=false;
  if(camMode==='drone'){
    const mid=[...marbles].sort((a,b)=>b.s-a.s).slice(3,9);
    _p1.set(0,0,0); mid.forEach(m=>_p1.add(marbleWorld(m,_p2))); _p1.divideScalar(Math.max(1,mid.length));
    const m0=mid[0]||leader(); if(m0){ frameAt(m0.s,FR);
      _p2.copy(_p1).addScaledVector(FR.up,26).addScaledVector(FR.tan,-14);
      camPos.lerp(_p2,0.08); camTgt.lerp(_p1,0.1); }
  } else {
    top2mid(_p1);
    const ref=[...marbles].sort((a,b)=>b.s-a.s)[0];
    if(ref) frameAt(ref.s,FR); else return;
    _p2.copy(_p1).addScaledVector(FR.tan,-10.5).addScaledVector(FR.up,5.4).addScaledVector(FR.side,3.4);
    camPos.x=lerp(camPos.x,_p2.x,0.06);
    camPos.y=lerp(camPos.y,_p2.y,0.12);
    camPos.z=lerp(camPos.z,_p2.z,0.12);
    _p2.copy(_p1).addScaledVector(FR.tan,9);
    camTgt.x=lerp(camTgt.x,_p2.x,0.06);
    camTgt.y=lerp(camTgt.y,_p2.y,0.12);
    camTgt.z=lerp(camTgt.z,_p2.z,0.12);
  }
  camera.position.copy(camPos); camera.lookAt(camTgt);
}

let state='setup',raceTime=0,finishers=[],recArmed=false;

function rankNow(){ return [...marbles].sort((a,b)=>b.s-a.s); }

  cctx.fillStyle='#9fd4f5'; cctx.fillRect(0,0,VW,VH);
  cctx.drawImage(canvas,dx,dy,dw,dh);
  cctx.drawImage(labCanvas,dx,dy,dw,dh);
  drawVideoHUD();
}
function startRec(){
  try{
    initAudio(); compositeFrame();
    const vs=compCanvas.captureStream(30);
    const tracks=[...vs.getVideoTracks(),...mediaDest.stream.getAudioTracks()];
    const mime=pickMime();
    recorder=new MediaRecorder(new MediaStream(tracks),mime?{mimeType:mime,videoBitsPerSecond:10e6}:undefined);
    recChunks=[];
    recorder.ondataavailable=e=>{ if(e.data.size) recChunks.push(e.data); };
    recorder.onstop=()=>{
      const blob=new Blob(recChunks,{type:mime||'video/webm'});
      recUrl=URL.createObjectURL(blob);
    };
    recorder.start(500); recording=true; recStartT=Date.now();
  }catch(e){ $('err').style.display='block'; $('err').textContent='⚠ Rekam gagal: '+e.message; }
}
function stopRec(){
  if(recorder&&recorder.state!=='inactive'){ try{recorder.stop();}catch(e){} }
  recorder=null; recording=false; clearInterval(recTimer);
}
function downloadRec(){ if(!recUrl) return;
  const a=document.createElement('a'); a.href=recUrl;
  a.download='balap-kelereng-kaca.'+(pickMime().includes('mp4')?'mp4':'webm'); a.click(); }

/* ================= UI WIRING ================= */
$('btnSetup').onclick=()=>$('drawerWrap').classList.add('on');
$('btnClose').onclick=()=>$('drawerWrap').classList.remove('on');
$('drawerWrap').addEventListener('click',e=>{ if(e.target.id==='drawerWrap') $('drawerWrap').classList.remove('on'); });
$('btnGoRace').onclick=()=>{ recArmed=false; newRace(); };
$('btnGoRec').onclick=()=>{ recArmed=true; newRace(); };
document.querySelectorAll('#labelSeg button').forEach(b=>b.onclick=()=>{
  labelMode=b.dataset.lm;
  document.querySelectorAll('#labelSeg button').forEach(x=>x.classList.toggle('on',x===b));
});
document.querySelectorAll('#camSeg button').forEach(b=>b.onclick=()=>{
  camMode=b.dataset.cm;
  document.querySelectorAll('#camSeg button').forEach(x=>x.classList.toggle('on',x===b));
});
$('btnShuffle').onclick=()=>{ seed=(Math.random()*1e9)|0; buildTrack(); buildTrackMesh(); buildObstacles(); buildMarbles(getNames()); };
$('btnArmRec').onclick=e=>{ recArmed=!recArmed;
  e.target.textContent='⏺ AUTO RECORD: '+(recArmed?'ON':'OFF');
  e.target.classList.toggle('armed',recArmed); };
$('btnDl2').onclick=downloadRec;
$('btnAgain').onclick=()=>{ $('podium').classList.remove('on'); newRace(); };
$('btnHome').onclick=()=>{ $('podium').classList.remove('on'); state='setup'; setUI();
  buildMarbles(getNames()); };
$('cnt').onchange=e=>{ const v=clamp(parseInt(e.target.value)||12,4,16); e.target.value=v;
  const cur=$('names').value.split('\n').filter(s=>s.trim());
  while(cur.length<v) cur.push('P'+(cur.length+1));
  $('names').value=cur.slice(0,v).join('\n'); };
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); sizeLabels();
});

/* ================= MAIN LOOP ================= */
const clock=new THREE.Clock();
let acc=0,boardT=0;
const HSTEP=1/60;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,clock.getDelta()),t=clock.elapsedTime;
  if(state==='setup'){ idleOrbit(dt); }
  else if(state==='race'){
    acc+=dt; let n=0;
    while(acc>=HSTEP&&n<4){ physStep(HSTEP); acc-=HSTEP; n++; }
    if(n===4) acc=0;
    raceTime+=dt;
    $('timer').textContent='⏱ '+fmtTime(raceTime);
    const ld=leader();
    $('leader').textContent='👑 '+(ld?ld.name:'-');
    if(rollGain&&AC) rollGain.gain.value=soundOn?clamp((ld?ld.vs:0)/22,0,0.5)*0.3:0;
    boardT+=dt;
    if(boardT>0.5){ boardT=0; detectOvertake(); }
    overtakeT=Math.max(0,overtakeT-dt);
    if(raceTime>RACE_TIMEOUT) endRace();
  }
  else if(state==='podium'){ victoryCam(dt); }
  // animasi pintu air start
  if(startGate&&startGate.openT>0&&startGate.openT<1){
    startGate.openT=Math.min(1,startGate.openT+dt*1.4);
    const e=1-Math.pow(1-startGate.openT,2);
    startGate.plank.position.y=0.75-e*2.2;
  }
  for(const sp of spinners){ sp.ang+=sp.spd*dt; sp.grp.rotation.y=sp.ang; }
  for(const b of bumpers){
    const s=b.ring.scale.x; if(s>1) b.ring.scale.setScalar(Math.max(1,s-dt*3));
    const ms=b.mesh.scale.x; if(ms>1) b.mesh.scale.set(Math.max(1,ms-dt*2),Math.min(1,b.mesh.scale.y+dt*2),Math.max(1,ms-dt*2));
  }
  for(const fl of finishFlags){ fl.rotation.y=Math.sin(t*3+fl.userData.ph)*0.35; }
  for(const cl of (window._clouds||[])){ cl.position.x+=cl.userData.vx*dt; if(cl.position.x>600) cl.position.x=-600; }
  stepParticles(dt);
  for(const m of marbles){
    marbleWorld(m,_p1); m.mesh.position.copy(_p1);
    frameAt(m.s,FR);
    m.blob.position.copy(FR.pos).addScaledVector(FR.side,m.lat).addScaledVector(FR.up,0.06+m.h*0.15);
    m.blob.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),FR.up);
    const bs=1+clamp(m.h*0.12,0,0.8);
    m.blob.scale.set(bs,bs,1);
    m.blob.material.opacity=clamp(1-m.h*0.08,0.4,1);
  }
  if(state==='race'||state==='podium') updateCamera();
  else if(state==='countdown'){ /* kamera diam saat countdown */ }
  drawLabels();
  renderer.render(scene,camera);
  if(recording) compositeFrame();
}

buildTrack(); buildTrackMesh(); buildObstacles(); buildMarbles(getNames());
setUI();
loop();
</script>
